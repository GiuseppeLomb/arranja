- dominio: haier-europe.com
  tipo: grupo
  descricao: Haier Europe (Haier, Candy, Hoover)
  marcas: [haier, candy, hoover]
- dominio: hisense-europe.com
  tipo: grupo
  descricao: Hisense Europe (grupo Gorenje)
  marcas: [hisense, gorenje]

