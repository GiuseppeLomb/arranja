# Domínios aceites como fonte (e em links de peças, sites de marcas e atribuições).
# Esquema: schemas/allowed_source.schema.json — verificado por `npm run validate`.
# Hierarquia: só documentação oficial dos fabricantes/marcas (incluindo os repositórios
# onde publicam manuais), retalhistas para as suas marcas próprias, e iFixit.
# Nada de blogs, fóruns, sites de SEO ou conteúdo gerado por IA.

- dominio: ifixit.com
  tipo: ifixit
  descricao: iFixit — guias com licença CC BY-NC-SA (exige atribuição)

- dominio: example.com
  tipo: exemplo
  descricao: Só para conteúdo de exemplo (example true), nunca em produção

# --- Grupos e fabricantes ---
- dominio: bsh-group.com
  tipo: grupo
  descricao: BSH Hausgeräte (documentos e manuais em media3.bsh-group.com)
  marcas: [bosch, siemens, balay, neff]
- dominio: neff-home.com
  tipo: fabricante
  descricao: Neff (BSH)
  marcas: [neff]
- dominio: electroluxgroup.com
  tipo: grupo
