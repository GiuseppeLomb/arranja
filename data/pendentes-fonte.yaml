# Fontes obtidas sem respeitar o robots.txt dos sites.
# Decisão (2026-11-05): o conteúdo publicado mantém-se, e estas fontes vão sendo substituídas por fontes
# permitidas, obtidas sempre por pedidos que cumprem o robots.txt (≥ 1 s entre pedidos, User-Agent identificado,
# paragem a qualquer sinal de bloqueio). O `npm run validate` confirma que os ids existem, que cada item (guia, árvore,
# código ou família) que cite um domínio de `fontes_proibidas` está aqui, e que está na secção certa.
#
# - so_estas_fontes: itens cuja única fonte é uma destas. `sem_alternativa: true` = procurei uma fonte permitida e
#   não encontrei; a decisão é do responsável pelo projeto.
# - parcial: itens que também têm fontes permitidas. A fonte proibida sai quando as permitidas cobrirem todo o
#   conteúdo (e, nos guias e árvores universais, pelo menos 2 marcas).

fontes_proibidas:
  - dominios: [macorlux.pt]
    regra: "Disallow: /bizizi1/ para todos os robôs (é onde estão os manuais); Disallow: / para ClaudeBot"
  - dominios: [downloadcenter.samsung.com]
    nota: inclui org.downloadcenter.samsung.com
    regra: "Disallow: / para todos os robôs"
  - dominios: []
    nota: "bosch-home.pt — Disallow: /*productservice/; nenhum item publicado cita estas páginas (o resto do site é permitido)"

substituidas:
  - fonte_nova: https://www.samsung.com/uk/support/home-appliances/what-do-the-codes-on-my-washing-machine-mean/
    antes: manual Samsung WW**BB (servidor de downloads da Samsung)
    nota: Descrições reescritas a partir da página oficial; âmbito passa a «sem-modelos» (a página não indica modelos).
    ids: [samsung-lr-oc, samsung-lr-lc, samsung-lr-3c, samsung-lr-3cp, samsung-lr-uc, samsung-lr-hc, samsung-lr-1c, samsung-lr-ac, samsung-lr-ac6, samsung-lr-8c, samsung-lr-dc1]
  - fonte_nova: https://www.samsung.com/uk/support/home-appliances/check-the-information-codes-of-the-dryer/
    antes: manual Samsung DV5000B (servidor de downloads da Samsung)
    nota: Descrições reescritas a partir da página oficial; âmbito passa a «sem-modelos».
    ids: [samsung-ms-tc, samsung-ms-tc5, samsung-ms-3c, samsung-ms-ac6, samsung-ms-hc]
  - fonte_nova: páginas oficiais de apoio da LG Reino Unido (help library)
    antes: manuais LG MFL71766782 e MFL72012058 (Macorlux)
    nota: Descrições reescritas a partir da página da LG; UE e LE mantêm também o manual da LG Mini (Auchan).
    ids: [lg-lr-ie, lg-lr-ue, lg-lr-oe, lg-lr-le, lg-lr-ff]
  - fonte_nova: artigos oficiais de apoio da AEG Reino Unido e da Electrolux Irlanda
    antes: manuais AEG 136202450-A-322023 e Electrolux 136205020-A-122024 (Macorlux)
    nota: Descrições reescritas a partir dos artigos de cada marca; âmbito passa a «sem-modelos».
    ids: [aeg-ms-e50, aeg-ms-eh0, electrolux-ms-e50, electrolux-ms-eh0]
  - fonte_nova: https://apiportalsat.teka.com/api/documentos/descargar/15
    antes: manual Teka TKD 1480 / TKD 1280 (Macorlux)
    nota: Manual de serviço oficial da gama SPA (TKD 1270, 1280, 1480, 1490, 1610 WD); descrições reescritas a partir da tabela de erros.
    ids: [teka-lr-e30, teka-lr-e10, teka-lr-e21]

so_estas_fontes:
  - grupo: LG — códigos ezDispense do manual MFL72012058 alojado pela Macorlux
    ids: [lg-lr-ed1, lg-lr-ed2, lg-lr-ed3, lg-lr-ed4, lg-lr-ed5, lg-lr-opn]
    procura: "O manual não está em lg.com nem noutro site permitido. As páginas oficiais da LG de outras regiões (Índia, EUA, Emirados) dão a estes códigos significados diferentes do manual europeu, por isso não servem de substituto."
    sem_alternativa: true
  - grupo: AEG e Electrolux — E90/E91 dos manuais de máquinas de secar alojados pela Macorlux
    ids: [aeg-ms-e90, electrolux-ms-e90]
    procura: "Os sites de apoio AEG/Electrolux (Portugal, Reino Unido, Irlanda) têm artigos para E50 e EH0, mas não para E90; electrolux-ui.com só pesquisa por PNC na página."
    sem_alternativa: true
  - grupo: Whirlpool — manual 400011319210 (combinado W9) alojado pela Macorlux
    ids: [whirlpool-fr-f]
    procura: "docs.whirlpool.eu é permitido pelo robots.txt, mas respondeu 403 a um pedido identificado (2026-11-08) e não se contorna; as páginas de apoio da Whirlpool (whirlpool.it) não têm o «F» dos frigoríficos."
    sem_alternativa: true
  - grupo: Samsung — manual DV5000B (servidor de downloads da Samsung), códigos que a página oficial do Reino Unido não tem
    ids: [samsung-ms-tc7, samsung-ms-hcl]
    procura: "As páginas oficiais da Samsung sobre códigos de máquinas de secar (Reino Unido, Austrália, Canadá, Emirados) não listam tC7 nem HCL."
    sem_alternativa: true

