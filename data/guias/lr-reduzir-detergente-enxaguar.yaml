id: lr-reduzir-detergente-enxaguar
titulo: Reduzir o detergente e fazer um enxaguamento extra
resumo: Detergente a mais faz espuma, deixa resíduos na roupa e pode até fazer verter água.
perigos:
  - eletricidade
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Volta a ligar a máquina e, se a roupa ficou com resíduos, faz um programa só de enxaguamento.
    imagem:
      src: imagens/guias/lavar-roupa/dose-detergente.svg
      alt: Copo doseador de detergente com uma marca a meio a indicar uma dose menor.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Se houver muita espuma durante a lavagem, a Bosch indica misturar uma colher de sopa de amaciador em meio litro de água e deitá-la no compartimento de dosagem manual do detergente (exceto com microfibras, roupa desportiva ou edredões).
  - texto: Na próxima lavagem, usa a dose recomendada na embalagem do detergente — menos se a água for macia, a carga pequena ou a roupa pouco suja.
  - texto: Usa um detergente adequado à máquina e ao tipo de roupa, como indica o manual da tua máquina.
  - texto: Se os restos ficarem na gaveta, limpa-a (guia «Limpar a gaveta do detergente») e confirma que a torneira está totalmente aberta.
