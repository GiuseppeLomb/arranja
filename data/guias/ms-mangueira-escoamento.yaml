id: ms-mangueira-escoamento
titulo: Verificar a mangueira de escoamento da condensação
resumo: Se a máquina escoa a água por uma mangueira, uma dobra ou gelo na mangueira impede o escoamento.
perigos:
  - agua
ferramentas:
  - toalhas
  - balde
tempo_estimado: 15
passos:
  - texto: Se a tua máquina tem a mangueira de escoamento ligada, segue-a e confirma que não está dobrada, torcida nem danificada.
    imagem:
      src: imagens/guias/secar/mangueira.svg
      alt: Máquina de secar com uma mangueira fina a sair da traseira até ao esgoto, com uma dobra assinalada.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Confirma que está bem ligada ao esgoto (Bosch, Samsung).
  - texto: Se a mangueira estiver congelada, a Samsung indica envolvê-la cerca de 10 minutos numa toalha embebida em água morna para descongelar e voltar a ligá-la.
    aviso: "A água congelada pode rachar as mangueiras: não instales a máquina num sítio onde possa gelar (Bosch, Becken)."
  - texto: "Se a máquina não tem mangueira ligada, a água vai para o depósito: esvazia-o (guia «Esvaziar o depósito da água»)."
