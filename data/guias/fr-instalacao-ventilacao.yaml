id: fr-instalacao-ventilacao
titulo: Verificar o local, o espaço à volta e a traseira
resumo: Sem espaço para o ar circular, ao sol ou perto de uma fonte de calor, o frigorífico arrefece pior e trabalha mais.
perigos:
  - peso
avisos:
  - "Não tires a tampa do painel traseiro: há risco de choque elétrico (Samsung)."
  - "A traseira e o fundo têm o circuito de refrigeração, arestas e peças que podem estar quentes (compressor, condensador): não metas aí as mãos nem objetos metálicos (Samsung, Becken)."
  - Com refrigerante R600a, a divisão tem de ter pelo menos 1 m³ por cada 8 g de refrigerante indicados na placa de características (Bosch, Samsung).
ferramentas: []
tempo_estimado: 15
passos:
  - texto: Confirma que o aparelho está num local seco e arejado, fora do sol direto e longe de fogões, radiadores e outras fontes de calor.
    imagem:
      src: imagens/guias/frigorifico/ventilacao.svg
      alt: Frigorífico com espaço livre dos lados, atrás e em cima, longe de um fogão.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Deixa espaço à volta para o ar circular: a Samsung e a Becken indicam pelo menos 5 cm dos lados e atrás, e a Samsung 10 cm por cima."
  - texto: Não tapes as grelhas de ventilação nem a zona por baixo do aparelho.
  - texto: "Com a ficha fora da tomada, limpa o pó da parte de trás de vez em quando, sem tocar nos tubos: a Samsung sugere aspirar uma ou duas vezes por ano."
  - texto: "Se o aparelho foi instalado há pouco: a Bosch indica esperar pelo menos 1 hora e a Becken 4 horas antes de o ligar. Depois, espera que chegue à temperatura regulada (Samsung)."
