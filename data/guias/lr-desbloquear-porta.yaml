# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: lr-desbloquear-porta
titulo: Desbloquear a porta depois do programa
resumo: A porta fica trancada por segurança enquanto há água, temperatura alta ou o programa ainda não acabou.
perigos:
  - agua
  - temperatura
  - eletricidade
ferramentas:
  - balde
  - toalhas
tempo_estimado: 15
passos:
  - texto: "Espera alguns minutos: a porta só destranca algum tempo depois de a máquina parar e quando a água e a temperatura baixam."
    imagem:
      src: imagens/guias/lavar-roupa/desbloquear-porta.svg
      alt: Porta de máquina de lavar com um cadeado e um relógio, a indicar que é preciso esperar.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Se vês água no tambor e a máquina tem corrente, escolhe um programa de escoamento ou de centrifugação para a tirar; a porta destranca no fim (Bosch). Com a opção «sem centrifugação final», a máquina para com água de propósito. Sem corrente, esvazia a água à mão (guia «Esvaziar a água da máquina à mão»).
    aviso: "Não forces a porta com água no tambor: inunda o chão."
  - texto: Volta a ligar a máquina e confirma que o bloqueio para crianças não está ativo — nalgumas máquinas impede abrir a porta.
  - texto: Se a porta continuar presa sem água e sem energia, algumas máquinas têm um desbloqueio de emergência junto ao filtro da bomba. Usa-o apenas como o manual da tua máquina indica.
    aviso: Nunca uses o desbloqueio de emergência com o tambor a rodar nem com água (sobretudo quente) dentro da máquina (Bosch).
  - texto: Se mesmo assim a porta não abrir, ou se aparecer um código do fecho da porta, chama um técnico.
