# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-nivelar
titulo: Nivelar o frigorífico para as portas fecharem bem
resumo: Desnivelado, o frigorífico faz barulho e as portas podem não fechar nem vedar bem.
perigos:
  - peso
avisos:
  - Para nivelar, a Samsung indica fazê-lo com o frigorífico vazio.
ferramentas:
  - nivel-bolha
  - chave-fendas
tempo_estimado: 20
passos:
  - texto: Confirma que o aparelho está num piso firme e plano.
    imagem:
      src: imagens/guias/frigorifico/nivelar.svg
      alt: Frigorífico visto de lado, ligeiramente inclinado para trás, com um nível de bolha e o pé da frente em destaque.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Ajusta os pés da frente (nalguns modelos, com uma chave de fendas) até o aparelho ficar nivelado de lado a lado.
  - texto: Deixa a frente ligeiramente mais alta do que a traseira, para as portas fecharem sozinhas. A Becken indica uma inclinação para trás de 10 a 15 mm.
  - texto: Confirma que o aparelho não toca na parede nem nos móveis vizinhos e que as portas fecham e vedam bem.
