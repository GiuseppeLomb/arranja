id: lr-limpar-gaveta-detergente
titulo: Limpar a gaveta do detergente
resumo: Restos de detergente e amaciador acumulam-se na gaveta e no encaixe, e podem impedir o detergente de ser levado pela água.
perigos:
  - eletricidade
avisos:
  - Se a tua máquina tiver doseamento automático de detergente, não mergulhes essa unidade em água — segue o manual.
ferramentas:
  - escova
  - toalhas
tempo_estimado: 15
passos:
  - texto: Puxa a gaveta até parar, carrega na patilha ou botão de desbloqueio e retira-a.
    imagem:
      src: imagens/guias/lavar-roupa/gaveta-detergente.svg
      alt: Gaveta do detergente retirada da máquina, com os compartimentos e a tampa do amaciador.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Retira as peças amovíveis, como a tampa do compartimento do amaciador.
  - texto: Lava a gaveta e as peças com água morna e um pano macio. Se houver detergente endurecido, deixa-o amolecer em água morna antes de esfregar.
  - texto: Limpa o encaixe da gaveta, dentro da máquina, com uma escova pequena que não seja metálica.
    aviso: Não deites água diretamente para o encaixe da gaveta.
  - texto: Seca tudo, volta a montar as peças e encaixa a gaveta.
