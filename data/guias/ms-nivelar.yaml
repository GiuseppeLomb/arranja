appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ms-nivelar
titulo: Nivelar a máquina de secar
resumo: Desnivelada, a máquina faz mais barulho, vibra e pode verter água.
perigos:
  - peso
ferramentas:
  - nivel-bolha
tempo_estimado: 15
passos:
  - texto: Confirma que a máquina está num piso firme, plano e limpo.
    imagem:
      src: imagens/guias/secar/nivelar.svg
      alt: Máquina de secar vista de frente com um nível de bolha em cima e os pés reguláveis em destaque.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Pousa um nível de bolha em cima da máquina e verifica de lado a lado e da frente para trás.
  - texto: "Roda os pés reguláveis até a máquina ficar nivelada e com os quatro pés bem assentes no chão. Não estiques os pés mais do que o necessário: a máquina vibra mais (Samsung)."
  - texto: Nunca tires os pés da máquina (Becken).
