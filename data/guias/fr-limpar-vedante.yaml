appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-limpar-vedante
titulo: Limpar e verificar o vedante da porta
resumo: "Um vedante sujo ou que não assenta bem deixa entrar ar quente: forma-se gelo e o aparelho arrefece pior."
perigos: []
ferramentas:
  - toalhas
tempo_estimado: 10
passos:
  - texto: Lava o vedante com água morna e um pano macio. A Bosch indica só água limpa; a Becken admite um detergente suave. Segue o manual da tua marca.
    imagem:
      src: imagens/guias/frigorifico/vedante.svg
      alt: Porta de frigorífico aberta com o vedante de borracha em destaque e um pano.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Tira restos de alimentos e bebidas pegajosas: podem colar o vedante à estrutura e rasgá-lo quando abres a porta. Não deixes óleo nem gordura no vedante: torna-se poroso (Bosch)."
  - texto: Enxagua e seca bem o vedante antes de voltares a ligar o aparelho.
    aviso: Não uses produtos abrasivos, lixívia nem solventes no vedante.
  - texto: Fecha a porta e confirma que o vedante assenta em toda a volta e que nenhum alimento impede a porta de fechar.
