# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ll-limpeza-cuba-vedante
titulo: Limpar a cuba e o vedante da porta
resumo: Restos no vedante e depósitos de gordura ou calcário na cuba causam maus cheiros e pequenas fugas.
perigos:
  - temperatura
avisos:
  - Depois de um programa, espera que a máquina arrefeça antes de limpares o interior.
ferramentas:
  - toalhas
tempo_estimado: 20
passos:
  - texto: Limpa primeiro os filtros (guia «Limpar os filtros da máquina de lavar loiça»).
  - texto: Passa um pano húmido com um pouco de detergente da loiça no vedante da porta e no rebordo inferior da porta.
    aviso: "Não uses sprays de limpeza na porta: a água pode entrar na fechadura e nas peças elétricas (Becken). Não deites água diretamente sobre a máquina (Samsung)."
    imagem:
      src: imagens/guias/lavar-loica/limpeza-cuba.svg
      alt: Máquina de lavar loiça aberta e vazia, com o vedante da porta em destaque e setas circulares.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Não tires o vedante da porta: é ele que mantém a máquina estanque."
  - texto: Volta a ligar a máquina. Com ela vazia, põe detergente para máquinas (ou um produto de limpeza próprio) e corre o programa de temperatura mais alta.
    aviso: Usa só produtos sem cloro.
  - texto: Depois de cada lavagem, ou se fores ficar muito tempo sem a usar, deixa a porta entreaberta para a humidade e os cheiros saírem.
