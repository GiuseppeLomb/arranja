id: lr-ciclo-limpeza-tambor
titulo: Fazer o ciclo de limpeza do tambor
resumo: Um programa de limpeza a alta temperatura, sem roupa, ajuda a evitar maus cheiros e depósitos.
perigos:
  - temperatura
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Com a máquina desligada, retira toda a roupa e objetos do tambor.
  - texto: Volta a ligar a máquina à corrente e abre a torneira da água.
  - texto: Escolhe o programa de limpeza do tambor da tua máquina (o nome varia de marca para marca). Se a máquina não tiver este programa, a Bosch indica como alternativa lavar a 60 °C ou mais.
    imagem:
      src: imagens/guias/lavar-roupa/limpeza-tambor.svg
      alt: Tambor de uma máquina de lavar, vazio, com setas circulares a indicar o ciclo de limpeza.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Usa só o produto que o manual da tua máquina indica para este programa — as indicações mudam de marca para marca (há quem peça detergente em pó, quem peça anticalcário e quem peça nada).
  - texto: No fim, deixa a porta e a gaveta do detergente abertas para secarem.
    aviso: Se houver crianças em casa, não deixes a porta aberta sem vigilância.
  - texto: Repete com regularidade (a LG sugere uma vez por mês; a Samsung avisa a cada 40 lavagens).
