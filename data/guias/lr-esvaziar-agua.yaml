appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: lr-esvaziar-agua
titulo: Esvaziar a água da máquina à mão
resumo: Para tirar a água que ficou no tambor quando a máquina não escoa ou antes de abrir o filtro da bomba.
perigos:
  - agua
  - temperatura
  - eletricidade
avisos:
  - "Pode sair mais água do que esperas: usa um recipiente largo e baixo e tem panos por perto."
ferramentas:
  - balde
  - toalhas
  - lanterna
tempo_estimado: 20
passos:
  - texto: Se a máquina lavou a temperatura alta, espera que a água arrefeça antes de começar.
    aviso: A água de lavagem pode estar muito quente.
  - texto: Abre a tampa de acesso ao filtro, em baixo, na frente da máquina.
    imagem:
      src: imagens/guias/lavar-roupa/esvaziar-agua.svg
      alt: Frente de uma máquina de lavar com a tampa inferior aberta e uma mangueira curta a escorrer água para um tabuleiro.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Põe por baixo um recipiente largo e baixo e espalha panos à volta.
  - texto: Se a máquina tiver uma mangueira de esvaziamento de emergência, puxa-a, segura a ponta sobre o recipiente e tira-lhe a tampa para a água escorrer. Se não tiver, desenrosca muito devagar a tampa do filtro só o suficiente para a água começar a sair.
  - texto: Quando o recipiente estiver quase cheio, volta a tapar, esvazia-o e repete até deixar de sair água.
  - texto: Volta a pôr a tampa na mangueira (ou fecha bem o filtro), arruma a mangueira no suporte e fecha a tampa de acesso.
