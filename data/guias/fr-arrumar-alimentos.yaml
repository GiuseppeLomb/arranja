appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-arrumar-alimentos
titulo: Arrumar os alimentos sem tapar a ventilação
resumo: Alimentos encostados às saídas de ar, comida quente e a porta muito tempo aberta são causas simples de gelo, condensação e pouco frio.
perigos: []
avisos:
  - "Não guardes garrafas nem latas de líquidos no congelador, sobretudo bebidas com gás: podem rebentar (Bosch, Becken)."
  - Não guardes no aparelho sprays com gás inflamável nem substâncias explosivas (Bosch, Samsung).
ferramentas: []
tempo_estimado: 5
passos:
  - texto: Não encostes alimentos às saídas de ar e não sobrecarregues o frigorífico.
    imagem:
      src: imagens/guias/frigorifico/arrumar.svg
      alt: Interior do frigorífico com alimentos espaçados e setas de ar a circular.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Deixa arrefecer a comida quente antes de a guardar.
  - texto: Tapa bem os alimentos com cheiro forte ou com muita humidade.
  - texto: Abre a porta o mínimo de tempo possível e confirma que nada a impede de fechar.
  - texto: Não congeles de uma vez mais alimentos frescos do que a capacidade máxima indicada na placa de características (Bosch).
  - texto: "Mantém as gavetas e prateleiras na posição original: ajudam a circulação do ar (Bosch, Samsung)."
