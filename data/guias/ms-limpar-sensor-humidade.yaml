risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ms-limpar-sensor-humidade
titulo: Limpar o sensor de humidade
resumo: O sensor de humidade decide quando a roupa está seca. Com calcário ou restos de detergente, a máquina para cedo ou demora demasiado.
perigos: []
ferramentas:
  - toalhas
tempo_estimado: 5
passos:
  - texto: Abre a porta e localiza o sensor de humidade no tambor (vê no manual onde fica no teu modelo).
    imagem:
      src: imagens/guias/secar/sensor.svg
      alt: Interior do tambor de uma máquina de secar com o sensor de humidade metálico em destaque e uma esponja.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: A Bosch indica limpá-lo com uma esponja áspera para tirar o calcário e os restos de detergente.
    aviso: "Não uses produtos de limpeza nem esfregões de aço: podem estragar o sensor (Bosch)."
  - texto: Faz esta limpeza com regularidade, sobretudo se a roupa sair húmida ou a secagem demorar muito.
