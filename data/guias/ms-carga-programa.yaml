id: ms-carga-programa
titulo: Acertar a carga e o programa
resumo: Carga a mais, carga muito pequena ou o programa errado deixam a roupa húmida ou com vincos.
perigos: []
avisos:
  - "Risco de incêndio: não seques roupa por lavar nem peças com espuma de borracha, e tira isqueiros e fósforos dos bolsos."
  - Peças com óleo, cera ou tinta têm de ser lavadas antes em água quente com detergente (Bosch). Peças que estiveram em contacto com gasolina, solventes ou outras substâncias inflamáveis não podem ir à máquina de secar (Samsung).
ferramentas: []
tempo_estimado: 5
passos:
  - texto: "Não ultrapasses a carga máxima do programa: vê a tabela de programas do manual."
  - texto: Separa as peças pesadas das leves e esvazia os bolsos antes de secar.
  - texto: Com uma carga muito pequena, a Samsung sugere juntar algumas toalhas; a Bosch sugere um programa por tempo.
  - texto: "No fim, a roupa quente parece mais húmida do que está: desdobra-a e deixa-a arrefecer antes de avaliares."
  - texto: Se ainda estiver húmida, aumenta o grau de secagem ou usa um programa por tempo para acabar de secar.
  - texto: Tira a roupa logo no fim do programa para não ganhar vincos.
