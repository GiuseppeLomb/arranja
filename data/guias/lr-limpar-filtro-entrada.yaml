# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: lr-limpar-filtro-entrada
titulo: Limpar o filtro da entrada de água
resumo: Um pequeno filtro de rede na ligação da mangueira pode entupir com calcário. Entupido, a máquina enche devagar ou não enche.
avisos:
  - "Antes de começares (e de desligares a máquina), a Bosch recomenda aliviar a pressão da mangueira: com a torneira fechada, liga um programa que não seja de enxaguar e centrifugar nem de escoar, durante cerca de 40 segundos, e para-o."
perigos:
  - agua
  - eletricidade
ferramentas:
  - alicate-pontas
  - escova
  - toalhas
  - balde
tempo_estimado: 20
passos:
  - texto: Confirma que a torneira da água está fechada.
  - texto: "Desenrosca a mangueira de entrada na parte de trás da máquina. Tapa a ponta com um pano: pode sair alguma água."
    imagem:
      src: imagens/guias/lavar-roupa/filtro-entrada.svg
      alt: Ligação da mangueira de entrada na traseira da máquina, com o pequeno filtro de rede retirado e um alicate de pontas.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Puxa o filtro de rede para fora com um alicate de pontas, sem o apertar demasiado.
  - texto: Limpa o filtro com uma escova e passa-o por água corrente até ficar sem depósitos.
  - texto: "Algumas mangueiras têm também um filtro na ponta que liga à torneira: se for o caso, limpa-o da mesma forma."
    aviso: "Se essa ponta tiver uma válvula Aquastop elétrica, nunca a mergulhes em água: há risco de choque elétrico (Bosch)."
  - texto: Volta a encaixar o filtro e enrosca a mangueira, bem apertada.
  - texto: Abre a torneira e confirma que não há fugas nas ligações.
