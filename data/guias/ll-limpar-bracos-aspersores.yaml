id: ll-limpar-bracos-aspersores
titulo: Limpar os braços aspersores
resumo: Calcário e restos de comida entopem os orifícios dos braços que espalham a água, e a loiça deixa de ficar limpa.
perigos: []
ferramentas:
  - escova
tempo_estimado: 15
passos:
  - texto: Puxa os cestos e vê se os orifícios dos braços aspersores estão entupidos.
    imagem:
      src: imagens/guias/lavar-loica/bracos.svg
      alt: Braço aspersor de uma máquina de lavar loiça com os orifícios em destaque e gotas de água a sair.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Para tirar o braço superior, desenrosca a porca ou a tampa que o prende e retira-o.
    aviso: "Tem cuidado ao retirar os braços: podem partir-se (Samsung)."
  - texto: Para tirar o braço inferior, puxa-o para cima (nalguns modelos é preciso soltar primeiro os encaixes).
  - texto: Lava os braços em água corrente, ou em água morna com um pouco de detergente da loiça, e desentope os orifícios com uma escova macia.
  - texto: Volta a montá-los, aperta bem o braço superior e roda-os à mão para confirmares que giram livremente.
