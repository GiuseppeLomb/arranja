id: ll-arrumar-loica
titulo: Arrumar a loiça para lavar e secar bem
resumo: Cestos demasiado cheios ou peças que travam os braços e o dispensador são a causa mais simples de loiça mal lavada.
perigos: []
ferramentas: []
tempo_estimado: 5
passos:
  - texto: "Não sobrecarregues os cestos: deixa espaço para a água chegar a todas as peças. A Bosch avisa que, numa máquina de instalar solta, cestos sobrecarregados podem fazê-la tombar."
    imagem:
      src: imagens/guias/lavar-loica/arrumar.svg
      alt: Cesto de uma máquina de lavar loiça com pratos espaçados e uma seta a mostrar o braço aspersor a rodar.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Depois de arrumar, roda os braços aspersores à mão: não podem bater em nenhuma peça."
  - texto: "Não deixes peças grandes à frente do dispensador de detergente: a tampa tem de abrir livremente."
  - texto: Prende bem as peças leves, para não se mexerem nem baterem durante a lavagem.
  - texto: Arruma as facas e utensílios afiados com as pontas para baixo no cesto dos talheres, ou deitados na prateleira das facas.
    aviso: Pontas viradas para cima podem ferir quem carrega ou descarrega a máquina.
  - texto: Coloca as peças com cavidades inclinadas, para a água escorrer.
  - texto: No fim, esvazia primeiro o cesto de baixo, para não pingar água do cesto de cima para a loiça já seca.
