id: ms-ventilar-divisao
titulo: Arejar a divisão e libertar a entrada de ar
resumo: A máquina de secar troca ar com a divisão. Num espaço fechado, a humidade sobe e a secagem demora mais.
perigos: []
ferramentas: []
tempo_estimado: 5
passos:
  - texto: "Areja a divisão enquanto a máquina trabalha: abre uma janela ou a porta."
    imagem:
      src: imagens/guias/secar/ventilar.svg
      alt: Máquina de secar junto a uma janela aberta, com setas de ar a entrar e a sair.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Mantém livre a entrada de ar da máquina e não reduzas o espaço por baixo dela com tapetes grossos.
  - texto: A Bosch indica que, abaixo de 15 °C ou acima de 30 °C na divisão, a secagem pode demorar mais.
  - texto: Se a humidade na divisão subir muito, a Becken indica limpar a grelha de arrefecimento e confirmar que o condensador está bem colocado.
