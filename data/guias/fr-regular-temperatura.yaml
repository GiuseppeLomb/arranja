# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-regular-temperatura
titulo: Verificar e acertar a temperatura
resumo: Uma regulação errada ou um modo especial ativo explicam muitos casos de frigorífico quente ou frio demais.
perigos: []
ferramentas: []
tempo_estimado: 5
passos:
  - texto: Volta a ligar o aparelho e vê no painel a temperatura regulada para o frigorífico e para o congelador.
    imagem:
      src: imagens/guias/frigorifico/temperatura.svg
      alt: Painel de um frigorífico com a temperatura e setas para subir e descer.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Se está frio demais, regula uma temperatura menos fria; se está quente, uma mais fria. Não regules mais frio do que o necessário.
  - texto: Confirma que não está ativo um modo especial, como o modo de férias (Samsung) ou a supercongelação.
  - texto: "Dá tempo ao aparelho: a Bosch indica voltar a verificar passadas algumas horas (se estava quente) ou no dia seguinte (se estava frio demais)."
  - texto: Se a temperatura continuar muito diferente da regulada, a Bosch indica que em alguns casos basta desligar o aparelho durante 5 minutos e voltar a ligar.
