id: lr-equilibrar-carga
titulo: Equilibrar a carga e repetir a centrifugação
resumo: Com a roupa mal distribuída, a máquina reduz ou cancela a centrifugação para se proteger.
perigos:
  - eletricidade
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Abre a porta (quando destrancar) e espalha a roupa pelo tambor, desfazendo bolas e nós.
    imagem:
      src: imagens/guias/lavar-roupa/equilibrar-carga.svg
      alt: Tambor visto de frente com peças de roupa espalhadas de forma equilibrada.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Se só tens uma peça grande e pesada (por exemplo, um roupão ou umas calças de ganga), junta-lhe outras peças: a Bosch explica que peças de tamanhos diferentes se distribuem melhor."
  - texto: Confirma que a velocidade de centrifugação não está no mínimo e que não escolheste uma opção sem centrifugação final. Se escolheste, continua o programa com «Centrifugação» ou «Escoamento» (Bosch).
  - texto: Volta a ligar a máquina e inicia um programa só de centrifugação.
