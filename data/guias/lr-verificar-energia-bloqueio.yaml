appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: lr-verificar-energia-bloqueio
titulo: Verificar tomada, disjuntor, torneira e bloqueio para crianças
resumo: "Antes de pensar em avaria, confirma o que é mais simples: corrente, água, porta e bloqueio para crianças."
perigos:
  - eletricidade
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Confirma que a ficha está bem encaixada na tomada.
    imagem:
      src: imagens/guias/lavar-roupa/energia.svg
      alt: Ficha e tomada ao lado de um disjuntor do quadro elétrico.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Testa a tomada com outro aparelho, ou confirma se a luz da divisão funciona.
  - texto: No quadro elétrico, vê se o disjuntor da máquina disparou e, se sim, volta a ligá-lo.
    aviso: "Se o disjuntor voltar a disparar quando ligas a máquina, não insistas: chama um eletricista ou um técnico."
  - texto: Volta a ligar a máquina e confirma que a porta está bem fechada, sem roupa entalada.
  - texto: Se o visor mostrar o símbolo do bloqueio para crianças, desativa-o (normalmente mantendo premidas uma ou duas teclas durante uns segundos — vê o manual).
  - texto: Confirma que a torneira da água está totalmente aberta.
