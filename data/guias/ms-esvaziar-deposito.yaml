id: ms-esvaziar-deposito
titulo: Esvaziar o depósito da água
resumo: As máquinas de condensação juntam a água da roupa num depósito. Cheio, o programa para.
perigos:
  - peso
ferramentas: []
tempo_estimado: 5
passos:
  - texto: "Puxa o depósito para fora na horizontal. Quando sair até meio, segura-o por baixo com a outra mão: cheio, é pesado."
    imagem:
      src: imagens/guias/secar/deposito.svg
      alt: Depósito de água a ser retirado na horizontal da máquina de secar, seguro com as duas mãos.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Despeja a água pela abertura do depósito.
    aviso: "Esta água não é potável: não a bebas nem a reutilizes."
  - texto: "A Samsung indica lavar o interior do depósito ao esvaziá-lo: enche-o com água morna e um pouco de detergente neutro, deixa atuar 30 minutos, enxagua e seca."
  - texto: Volta a encaixar o depósito até ao fim.
  - texto: "Esvazia-o depois de cada secagem. Se encher a meio, a máquina para: depois de o esvaziares, carrega em iniciar para continuar."
