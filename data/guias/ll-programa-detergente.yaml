id: ll-programa-detergente
titulo: Escolher o programa e a dose de detergente
resumo: Um programa fraco para a sujidade, detergente a menos ou mal guardado deixam restos na loiça.
perigos: []
avisos:
  - "O detergente para máquinas de lavar loiça é corrosivo: guarda-o fora do alcance das crianças."
ferramentas: []
tempo_estimado: 5
passos:
  - texto: "Escolhe o programa conforme a sujidade: para loiça muito suja, um programa mais forte."
  - texto: "Não é preciso pré-lavar a loiça: a Bosch indica tirar só os restos maiores, porque o sensor pode escolher um ciclo mais fraco."
  - texto: Usa a dose de detergente indicada para a carga e só detergente próprio para máquinas de lavar loiça.
  - texto: "Pastilhas podem não se dissolver a tempo em programas rápidos ou curtos: nesses, usa detergente em pó ou um programa mais forte."
  - texto: "Põe o detergente só com o dispensador seco e guarda-o num sítio seco: detergente antigo ou empapado lava pior."
  - texto: "Com água macia, usa menos detergente: o excesso pode deixar manchas esbranquiçadas nos copos."
