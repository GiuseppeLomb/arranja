appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ms-verificar-energia-porta
titulo: Verificar tomada, fusíveis, porta e bloqueio para crianças
resumo: "Antes de pensar em avaria, confirma o mais simples: corrente, porta bem fechada, bloqueio para crianças e início."
perigos:
  - eletricidade
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Confirma que a ficha está bem ligada à tomada.
    aviso: "Não uses extensões nem tomadas múltiplas (risco de incêndio). Se o cabo estiver danificado, não uses a máquina: a substituição é com a assistência."
    imagem:
      src: imagens/guias/secar/energia.svg
      alt: Ficha e tomada ao lado de um disjuntor do quadro elétrico.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: No quadro elétrico, vê se um fusível ou disjuntor disparou e volta a ligá-lo.
    aviso: "Se disparar outra vez, não insistas: chama um eletricista ou a assistência técnica."
  - texto: Volta a ligar a máquina e confirma que a porta está bem fechada.
  - texto: "Confirma que o bloqueio para crianças não está ativo (como se desativa depende do modelo: vê o manual)."
  - texto: Escolhe um programa e carrega na tecla de início. Se abriste a porta a meio do programa, tens de carregar outra vez em iniciar.
  - texto: Se programaste um fim ou início diferido, a máquina só arranca mais tarde (Bosch).
