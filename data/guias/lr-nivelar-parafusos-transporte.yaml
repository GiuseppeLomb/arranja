appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: lr-nivelar-parafusos-transporte
titulo: Nivelar a máquina e retirar os parafusos de transporte
resumo: Parafusos de transporte esquecidos ou uma máquina desnivelada causam vibração e barulho forte na centrifugação.
perigos:
  - peso
  - eletricidade
ferramentas:
  - chave-inglesa
  - nivel-bolha
tempo_estimado: 30
passos:
  - texto: Se a máquina é nova ou foi mudada de casa, vê na parte de trás se ainda tem os parafusos de transporte.
  - texto: Para os retirar, desaperta-os com a chave indicada no manual, tira-os e tapa os orifícios com as tampas fornecidas. Guarda os parafusos para uma mudança futura.
  - texto: Pousa um nível de bolha em cima da máquina, nos dois sentidos.
    imagem:
      src: imagens/guias/lavar-roupa/nivelar.svg
      alt: Máquina de lavar vista de frente com um nível de bolha em cima e os pés reguláveis em destaque.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Desaperta a contraporca de cada pé e roda o pé até a máquina ficar nivelada, com os quatro pés bem assentes no chão.
  - texto: Aperta as contraporcas contra a máquina para os pés não rodarem com a vibração.
  - texto: Confirma que a máquina não encosta a móveis nem à parede.
