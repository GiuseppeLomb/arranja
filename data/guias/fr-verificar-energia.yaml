# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-verificar-energia
titulo: Verificar a tomada e o fusível
resumo: Sem nenhuma luz acesa, comece pela corrente.
perigos:
  - eletricidade
avisos:
  - Não ligues o frigorífico a tomadas múltiplas nem a extensões (Bosch).
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Confirma que a ficha está bem ligada à tomada.
    aviso: "Se o cabo ou a ficha estiverem danificados, não uses o aparelho: a substituição é com a assistência (Becken, Bosch)."
    imagem:
      src: imagens/guias/frigorifico/energia.svg
      alt: Ficha e tomada ao lado de um disjuntor do quadro elétrico.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Vê se há corrente em casa (por exemplo, se a luz da cozinha acende) e se algum fusível ou disjuntor disparou.
    aviso: "Se o disjuntor voltar a disparar, não insistas: chama um eletricista ou a assistência."
  - texto: Se a tomada estiver danificada, não a uses e pede a reparação (Becken).
  - texto: Depois de voltares a ligar, é normal o compressor não arrancar logo durante alguns minutos (Becken).
