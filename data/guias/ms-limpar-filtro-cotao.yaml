id: ms-limpar-filtro-cotao
titulo: Limpar o filtro de cotão
resumo: "Um filtro de cotão sujo reduz a passagem de ar: a roupa demora mais a secar e a máquina gasta mais energia."
perigos: []
avisos:
  - Nunca uses a máquina sem o filtro de cotão, ou com ele incompleto ou estragado.
  - "O cotão que fica no filtro pode inflamar-se durante a secagem: limpa-o com regularidade (Bosch)."
ferramentas:
  - escova
tempo_estimado: 5
passos:
  - texto: Abre a porta e tira o cotão que ficou agarrado à porta.
  - texto: Puxa o filtro de cotão para fora. Tira o cotão da abertura onde o filtro encaixa, sem o deixar cair para dentro.
    imagem:
      src: imagens/guias/secar/filtro-cotao.svg
      alt: Filtro de cotão retirado da porta de uma máquina de secar, aberto, com cotão a ser removido.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Abre o filtro. Se tiver duas partes, separa-as e tira o cotão das duas.
  - texto: "Se estiver muito sujo, passa-o por água corrente e deixa-o secar completamente antes de o voltares a pôr: um filtro molhado pode criar bolor e maus cheiros."
  - texto: "Não sacudas nem batas com o filtro e não forces a abertura: pode estragar-se."
  - texto: Volta a montar o filtro e encaixa-o no lugar. Limpa-o depois de cada secagem.
