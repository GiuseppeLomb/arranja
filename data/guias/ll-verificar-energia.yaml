appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ll-verificar-energia
titulo: Verificar tomada, disjuntor, porta e bloqueio para crianças
resumo: "Antes de pensar em avaria, confirma o mais simples: corrente, porta bem fechada e bloqueio para crianças."
perigos:
  - eletricidade
ferramentas: []
tempo_estimado: 10
passos:
  - texto: Confirma que a ficha está bem encaixada na tomada. Nas Bosch, confirma também a ligação do cabo na traseira da máquina.
    aviso: "Se o cabo ou a ficha estiverem danificados, não uses a máquina: a substituição é com a assistência. Não a ligues a extensões nem a tomadas múltiplas."
    imagem:
      src: imagens/guias/lavar-loica/energia.svg
      alt: Ficha e tomada ao lado de um disjuntor do quadro elétrico.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Testa a tomada com outro aparelho.
  - texto: No quadro elétrico, vê se o disjuntor disparou e, se sim, volta a ligá-lo. A Becken aconselha não ter outros aparelhos ligados ao mesmo circuito.
    aviso: "Se o disjuntor voltar a disparar, não insistas: chama um eletricista ou a assistência técnica."
  - texto: Para reiniciar, deixa a máquina desligada da corrente pelo menos 5 segundos e volta a ligá-la.
  - texto: Fecha a porta com firmeza, sem a bater, e confirma que nenhuma peça ou cesto a impede de fechar.
  - texto: Se o painel acende mas não aceita ordens, confirma se o bloqueio para crianças está ativo. A forma de o desativar depende do modelo (vê o manual).
