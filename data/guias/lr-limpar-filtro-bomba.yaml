id: lr-limpar-filtro-bomba
titulo: Limpar o filtro da bomba de escoamento
resumo: O filtro apanha cotão, moedas e ganchos. Entupido, a máquina deixa de escoar ou faz barulho.
perigos:
  - agua
  - temperatura
  - eletricidade
avisos:
  - "Nunca abras o filtro durante um programa: pode haver água quente."
ferramentas:
  - balde
  - toalhas
  - escova
  - lanterna
tempo_estimado: 25
passos:
  - texto: Esvazia primeiro a água que estiver na máquina (guia «Esvaziar a água da máquina à mão»).
  - texto: Com o recipiente e os panos no sítio, desenrosca a tampa do filtro devagar, no sentido contrário ao dos ponteiros do relógio — ainda vai sair alguma água.
    imagem:
      src: imagens/guias/lavar-roupa/filtro-bomba.svg
      alt: Tampa redonda do filtro da bomba com uma seta a indicar rotação no sentido contrário ao dos ponteiros do relógio.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Retira o filtro e tira tudo o que estiver preso: cotão, moedas, ganchos, botões."
  - texto: Limpa o filtro e o interior do alojamento com uma escova macia e água.
  - texto: Com uma lanterna, confirma que a hélice da bomba, ao fundo do alojamento, roda livremente e não tem nada preso.
  - texto: Volta a colocar o filtro e enrosca-o até ao fim, bem apertado.
    aviso: Um filtro mal fechado pode verter água.
  - texto: Fecha a tampa de acesso. Na próxima lavagem, espreita se há água a sair por esta zona.
