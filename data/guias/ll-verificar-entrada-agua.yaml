  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ll-verificar-entrada-agua
titulo: Verificar a torneira, a mangueira e o filtro da entrada de água
resumo: Torneira fechada, mangueira dobrada ou filtro entupido impedem a máquina de encher.
perigos:
  - agua
ferramentas:
  - toalhas
tempo_estimado: 15
passos:
  - texto: Confirma que a torneira da máquina está totalmente aberta e que há água noutras torneiras da casa.
    imagem:
      src: imagens/guias/lavar-loica/entrada-agua.svg
      alt: Torneira de segurança com a mangueira de admissão ligada e o pequeno filtro de rede à vista.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Segue a mangueira de admissão e confirma que não está dobrada, esmagada nem entalada atrás da máquina.
  - texto: A Bosch indica um caudal mínimo de 10 litros por minuto com a torneira aberta. Se a água sai fraca, a torneira pode estar encravada ou com calcário.
  - texto: "Nas Bosch, o filtro da entrada fica na ligação da mangueira: fecha a torneira, desenrosca a ligação, limpa o pequeno filtro de rede e volta a enroscar. Tem um pano à mão: sai alguma água."
    aviso: "Se a mangueira tiver Aqua-Stop, a caixa de plástico junto à torneira tem uma peça elétrica: nunca a mergulhes em água nem cortes a mangueira (Bosch, Samsung)."
  - texto: Abre a torneira e confirma que a ligação não pinga.
