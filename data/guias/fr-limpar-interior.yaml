# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: fr-limpar-interior
titulo: Limpar o interior e tirar maus cheiros
resumo: Alimentos estragados e embalagens sujas são a causa habitual dos maus cheiros.
perigos:
  - eletricidade
avisos:
  - "Não deites água diretamente sobre o aparelho e não uses máquinas de limpar a vapor: há risco de choque elétrico."
  - Não uses velas acesas para tirar cheiros nem secadores de cabelo lá dentro (Samsung), não ligues aparelhos elétricos dentro do frigorífico (Bosch, Samsung) e não deixes entrar água na iluminação (Bosch).
ferramentas:
  - toalhas
tempo_estimado: 30
passos:
  - texto: Tira todos os alimentos e deita fora o que estiver estragado. Guarda o resto num sítio fresco.
    imagem:
      src: imagens/guias/frigorifico/limpar.svg
      alt: Frigorífico vazio e aberto, com as prateleiras retiradas e um pano.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: "Tira as prateleiras e gavetas. A Bosch desaconselha lavá-las na máquina de lavar loiça: podem deformar-se."
  - texto: Limpa o interior com um pano macio, água morna e um pouco de detergente neutro. Não uses produtos abrasivos, solventes, lixívia nem com cloro.
  - texto: "Cada marca tem as suas regras: a Samsung desaconselha vinagre e bicarbonato; a Becken indica uma solução fraca de bicarbonato para o congelador. Segue o manual da tua."
  - texto: "Não laves prateleiras de vidro frias com água quente: podem partir-se (Samsung)."
  - texto: Seca tudo bem, limpa as embalagens e volta a arrumar, tapando bem os alimentos com cheiro forte. A Bosch sugere verificar passadas 24 horas se o cheiro voltou.
