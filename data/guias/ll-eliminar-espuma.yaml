# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ll-eliminar-espuma
titulo: Tirar a espuma da máquina
resumo: Detergente da loiça à mão ou abrilhantador entornado fazem espuma que pode transbordar pela porta.
perigos:
  - agua
ferramentas:
  - toalhas
tempo_estimado: 20
passos:
  - texto: Abre a porta e deixa a espuma baixar (Becken). Limpa com um pano o abrilhantador que tiver entornado (Bosch, Becken).
    imagem:
      src: imagens/guias/lavar-loica/espuma.svg
      alt: Cuba de uma máquina de lavar loiça com espuma no fundo e um pano.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: A Becken indica depois deitar cerca de 1 litro de água fria no fundo da cuba, voltar a ligar a máquina, fechar a porta e correr um programa de pré-lavagem para escoar a água, repetindo se for preciso.
  - texto: A partir daí, usa só detergente próprio para máquinas de lavar loiça (Becken, Samsung). Nunca ponhas detergente da loiça à mão no depósito do abrilhantador (Bosch).
