id: lr-verificar-mangueira-escoamento
titulo: Verificar a mangueira de escoamento
resumo: Uma mangueira dobrada, esmagada ou mal ligada impede a máquina de escoar e pode causar fugas.
perigos:
  - agua
  - peso
  - eletricidade
ferramentas:
  - lanterna
  - balde
  - toalhas
tempo_estimado: 15
passos:
  - texto: "Se precisares de afastar a máquina da parede, fá-lo devagar, só o necessário, e com ajuda: é pesada."
  - texto: Segue a mangueira de escoamento desde a máquina até ao esgoto e confirma que não está dobrada, esmagada nem entalada entre a máquina e a parede.
    imagem:
      src: imagens/guias/lavar-roupa/mangueira-escoamento.svg
      alt: Mangueira de escoamento a subir da máquina até ao tubo de esgoto, com uma dobra assinalada.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Confirma que a ponta não está pousada no chão e que está bem presa ao sifão ou ao tubo de esgoto.
  - texto: Vê no manual da tua máquina a altura máxima a que a mangueira pode subir (a Bosch, por exemplo, indica 1 metro no máximo).
  - texto: Se a mangueira estiver dobrada ou entupida, endireita-a e limpa-a. Se estiver desimpedida e a máquina continuar sem escoar, o problema pode estar no esgoto da casa.
  - texto: Volta a ligar e fixar a mangueira e encosta a máquina com cuidado, sem a entalar.
