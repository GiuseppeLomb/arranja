id: lr-limpar-borracha-porta
titulo: Limpar a borracha da porta
resumo: Objetos e cotão presos na borracha causam fugas e maus cheiros.
perigos:
  - eletricidade
ferramentas:
  - toalhas
  - lanterna
tempo_estimado: 10
passos:
  - texto: Abre a porta e afasta com cuidado a dobra da borracha para veres o interior.
    imagem:
      src: imagens/guias/lavar-roupa/borracha-porta.svg
      alt: Porta aberta com a dobra da borracha afastada, mostrando uma moeda e cotão no interior.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Retira moedas, ganchos, botões e cotão presos na dobra.
  - texto: Limpa a borracha e o vidro da porta com um pano húmido e seca-os.
  - texto: "A Bosch indica que a abertura de entrada na borracha da porta pode ficar entupida: se a tua máquina a tiver, confirma que está desimpedida, sem usar objetos pontiagudos."
  - texto: Depois de cada lavagem, deixa a porta entreaberta para o interior secar.
    aviso: Se houver crianças em casa, não deixes a porta aberta sem vigilância.
