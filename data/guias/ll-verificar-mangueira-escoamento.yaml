id: ll-verificar-mangueira-escoamento
titulo: Verificar a mangueira de escoamento
resumo: Uma mangueira dobrada, entupida ou uma ligação ao sifão fechada deixam a água no fundo da máquina.
perigos:
  - agua
  - peso
ferramentas:
  - lanterna
  - toalhas
tempo_estimado: 15
passos:
  - texto: Segue a mangueira de escoamento até ao sifão ou ao esgoto e confirma que não está dobrada, esmagada nem entupida.
    imagem:
      src: imagens/guias/lavar-loica/mangueira-escoamento.svg
      alt: Máquina de lavar loiça com a mangueira de escoamento a subir até ao sifão do lava-loiça.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Confirma que a máquina não está pousada em cima da mangueira.
  - texto: "Se a máquina foi instalada há pouco, confirma que a saída do sifão para a mangueira foi aberta: a Bosch indica que pode ter ficado fechada."
  - texto: Confirma que a mangueira está bem presa ao sifão. A Becken indica que, mesmo com extensão, não deve passar de 4 metros, e que a ligação ao esgoto deve ficar entre 50 e 100 cm acima da base da máquina.
  - texto: Se a mangueira estiver dobrada ou entupida, endireita-a e limpa-a. Se estiver desimpedida e a água continuar parada, o problema pode estar no esgoto da casa.
