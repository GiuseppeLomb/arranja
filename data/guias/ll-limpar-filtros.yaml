id: ll-limpar-filtros
titulo: Limpar os filtros da máquina de lavar loiça
resumo: Os filtros no fundo da cuba seguram restos de comida. Sujos, a loiça sai mal lavada e a água pode ficar no fundo.
perigos:
  - arestas-cortantes
avisos:
  - Nunca uses a máquina sem os filtros montados.
ferramentas:
  - escova
  - toalhas
tempo_estimado: 15
passos:
  - texto: Abre a porta e tira o cesto inferior para chegares ao fundo da cuba.
  - texto: "Roda o filtro cilíndrico no sentido contrário ao dos ponteiros do relógio e levanta-o: sai o conjunto de filtros (filtro grosso, filtro plano e microfiltro, conforme o modelo)."
    imagem:
      src: imagens/guias/lavar-loica/filtros.svg
      alt: Fundo de uma máquina de lavar loiça com o filtro cilíndrico a ser rodado e levantado, e o filtro plano por baixo.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Tira os restos de comida e passa os filtros por água corrente. A Becken indica usar uma escova de limpeza no filtro grosso e no microfiltro.
    aviso: "Pode haver pedaços de vidro ou ossos presos: tira-os com cuidado."
  - texto: "Não deixes os filtros bater noutros objetos: se ficarem deformados, a máquina lava pior."
  - texto: Volta a montar os filtros pela ordem inversa e roda o filtro cilíndrico até ficar preso. Nas Bosch, as setas devem ficar frente a frente.
  - texto: "Verifica os filtros com frequência: a Bosch e a Becken recomendam espreitá-los depois de cada lavagem e a Samsung limpá-los uma vez por mês."
