id: lr-apertar-ligacoes-mangueiras
titulo: Verificar e apertar as ligações das mangueiras
resumo: Ligações soltas na torneira ou na traseira da máquina são uma causa comum de fugas.
perigos:
  - agua
  - peso
  - eletricidade
ferramentas:
  - toalhas
  - lanterna
tempo_estimado: 15
passos:
  - texto: Seca a zona e põe um pano por baixo das ligações para veres de onde vem a água.
  - texto: Confirma que a mangueira de entrada está bem enroscada na torneira e na traseira da máquina, e aperta à mão se estiver solta.
    imagem:
      src: imagens/guias/lavar-roupa/ligacoes-mangueiras.svg
      alt: Ligação roscada da mangueira de entrada com uma seta a indicar o aperto.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Confirma que a mangueira de entrada não está dobrada, torcida nem entalada atrás da máquina.
  - texto: Confirma que a mangueira de escoamento está bem presa ao esgoto e que a ponta não está no chão.
  - texto: Abre a torneira devagar e confirma que as ligações não pingam.
  - texto: "Se uma mangueira estiver rachada ou danificada, não a remendes: substitui-a por uma nova."
    aviso: Se a água sair da própria mangueira de entrada, para de usar a máquina, desliga-a da corrente e contacta a assistência (Samsung).
