# O passo «Desliga da corrente (e da água, se aplicável)» é acrescentado pela app.
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
risk_level: baixo
pecas: []
license: CC-BY-NC-SA-4.0
id: ll-nivelar
titulo: Nivelar a máquina de lavar loiça
resumo: Uma máquina desnivelada faz mais barulho, vibra e pode verter água.
perigos:
  - peso
ferramentas:
  - nivel-bolha
tempo_estimado: 20
passos:
  - texto: Confirma que a máquina assenta num piso firme e nivelado.
    imagem:
      src: imagens/guias/lavar-loica/nivelar.svg
      alt: Máquina de lavar loiça vista de frente com um nível de bolha em cima e os pés reguláveis em destaque.
      licenca: CC-BY-NC-SA-4.0
      autor: Arranja
  - texto: Pousa um nível de bolha em cima da máquina para confirmares se está nivelada.
  - texto: Enrosca ou desenrosca os pés reguláveis até a máquina ficar nivelada; a Samsung indica levantar ligeiramente a frente ou a traseira enquanto os rodas. A Becken indica que a inclinação não deve passar de 2 graus.
  - texto: Se a máquina estiver encastrada ou debaixo de uma bancada, confirma que, ao fechar, a porta não bate nos móveis vizinhos.
