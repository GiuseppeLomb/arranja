# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-para-a-meio
ordem: 9
titulo: A máquina de secar para antes de a roupa estar seca
sintoma: Para a meio do programa
inicio: deposito
nos:
  deposito:
    tipo: pergunta
    texto: Aparece o aviso de depósito cheio?
    ajuda: "É normal: na fase de arrefecimento o tambor pode rodar até cerca de 10 minutos com a máquina em pausa (Bosch), e a Becken indica que o tambor pode parar uns 40 segundos a meio e depois continuar."
    respostas:
      - texto: Sim
        ir_para: fim-deposito
      - texto: Não
        ir_para: luz
  luz:
    tipo: pergunta
    texto: Houve uma falha de luz?
    respostas:
      - texto: Sim
        ir_para: fim-luz
      - texto: Não
        ir_para: carga
  carga:
    tipo: pergunta
    texto: A carga era muito pequena?
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: fim-tecnico
  fim-deposito:
    tipo: guia
    guias:
      - ms-esvaziar-deposito
  fim-luz:
    tipo: guia
    guias:
      - ms-verificar-energia-porta
    nota: "Se o programa parou antes do arrefecimento, a roupa pode estar quente o suficiente para se inflamar: tira-a toda logo e estende-a (Bosch, Becken). Depois podes voltar a iniciar o programa."
  fim-carga:
    tipo: guia
    guias:
      - ms-carga-programa
    nota: "Com cargas muito pequenas a máquina pode desligar-se cedo: junta algumas toalhas (Samsung)."
  fim-tecnico:
    tipo: tecnico
    motivo: "A Bosch indica desligar e voltar a ligar a máquina; se a paragem se repetir, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
