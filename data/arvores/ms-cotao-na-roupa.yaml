id: ms-cotao-na-roupa
ordem: 11
titulo: A roupa sai com cotão
sintoma: Roupa com cotão
inicio: filtro
nos:
  filtro:
    tipo: pergunta
    texto: O filtro de cotão estava limpo antes de começares?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-filtro
      - texto: Sim
        ir_para: mistura
  mistura:
    tipo: pergunta
    texto: Secaste juntas peças que largam cotão (como toalhas) e peças onde o cotão agarra?
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: bolsos
  bolsos:
    tipo: pergunta
    texto: Esvaziaste os bolsos (lenços de papel, por exemplo)?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-carga
      - texto: Sim
        ir_para: fim-filtro
  fim-filtro:
    tipo: guia
    guias:
      - ms-limpar-filtro-cotao
    nota: Com peças que largam muito cotão, pode ser preciso limpar o filtro a meio do programa (Samsung).
  fim-carga:
    tipo: guia
    guias:
      - ms-carga-programa
    nota: Seca à parte as peças que largam cotão (Samsung).
