# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-para-a-meio
ordem: 11
titulo: A máquina de lavar roupa para a meio do programa
sintoma: Para a meio do programa
inicio: energia
nos:
  energia:
    tipo: pergunta
    texto: A máquina ficou sem energia (visor apagado)?
    ajuda: "Algumas paragens são normais: há programas com pausas de molho e a máquina redistribui a roupa antes de centrifugar."
    respostas:
      - texto: Sim
        ir_para: fim-energia
      - texto: Não
        ir_para: agua
  agua:
    tipo: pergunta
    texto: Parou com água no tambor que não escoa?
    respostas:
      - texto: Sim
        ir_para: opcao
      - texto: Não
        ir_para: carga
  opcao:
    tipo: pergunta
    texto: Escolheste a opção «sem centrifugação final» ou «paragem no enxaguamento»?
    respostas:
      - texto: Sim
        ir_para: fim-opcao
      - texto: Não ou não sei
        ir_para: fim-escoa
  carga:
    tipo: pergunta
    texto: Parou antes de centrifugar, com a roupa toda para um lado?
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: entrada
  entrada:
    tipo: pergunta
    texto: A água estava a entrar bem (torneira aberta, filtro limpo)?
    respostas:
      - texto: Sim
        ir_para: fim-tecnico
      - texto: Não ou não sei
        ir_para: fim-entrada
  fim-energia:
    tipo: guia
    guias:
      - lr-verificar-energia-bloqueio
  fim-opcao:
    tipo: guia
    guias:
      - lr-equilibrar-carga
    nota: "Não é avaria: a máquina para com água de propósito. Continua o programa escolhendo «Centrifugação» ou «Escoamento» (Bosch)."
  fim-escoa:
    tipo: guia
    guias:
      - lr-verificar-mangueira-escoamento
      - lr-esvaziar-agua
      - lr-limpar-filtro-bomba
  fim-carga:
    tipo: guia
    guias:
      - lr-equilibrar-carga
  fim-entrada:
    tipo: guia
    guias:
      - lr-limpar-filtro-entrada
      - lr-verificar-energia-bloqueio
  fim-tecnico:
    tipo: tecnico
    motivo: Se a máquina continua a parar sem causa visível, desliga-a e volta a ligá-la (Bosch, Samsung). Se voltar a acontecer, os fabricantes mandam contactar a assistência técnica. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico. Se aparecer um código no visor, anota-o para o dares à assistência.
