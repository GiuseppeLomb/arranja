# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-nao-liga
ordem: 1
titulo: A máquina de lavar loiça não liga ou não arranca
sintoma: Não liga ou não arranca
codigos:
  - becken-ll-e1
  - samsung-ll-dc
inicio: painel
nos:
  painel:
    tipo: pergunta
    texto: O painel acende quando ligas a máquina?
    respostas:
      - texto: Sim
        ir_para: porta
      - texto: Não
        ir_para: fim-energia
  porta:
    tipo: pergunta
    texto: A porta fecha bem, sem nenhuma peça ou cesto a impedir?
    ajuda: A Samsung indica também confirmar que o cesto superior está bem montado.
    respostas:
      - texto: Sim
        ir_para: bloqueio
      - texto: Não ou não sei
        ir_para: fim-porta
  bloqueio:
    tipo: pergunta
    texto: O bloqueio para crianças pode estar ativo?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-bloqueio
      - texto: Não
        ir_para: torneira
  torneira:
    tipo: pergunta
    texto: A torneira da água está aberta?
    respostas:
      - texto: Sim
        ir_para: reiniciar
      - texto: Não
        ir_para: fim-agua
  reiniciar:
    tipo: pergunta
    texto: Já desligaste a máquina da corrente, esperaste uns segundos e voltaste a ligar?
    respostas:
      - texto: Não
        ir_para: fim-reiniciar
      - texto: Sim
        ir_para: fim-tecnico
  fim-energia:
    tipo: guia
    guias:
      - ll-verificar-energia
  fim-porta:
    tipo: guia
    guias:
      - ll-arrumar-loica
      - ll-verificar-energia
    nota: Fecha a porta com firmeza. Se não fechar, vê se alguma peça, o cesto superior ou um móvel vizinho bate na porta.
  fim-bloqueio:
    tipo: guia
    guias:
      - ll-verificar-energia
    nota: "Desativa o bloqueio para crianças: a forma depende do modelo."
  fim-agua:
    tipo: guia
    guias:
      - ll-verificar-entrada-agua
  fim-reiniciar:
    tipo: guia
    guias:
      - ll-verificar-energia
    nota: A Bosch indica desligar a máquina da corrente pelo menos 5 segundos e voltar a ligar.
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a máquina continua sem arrancar, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados. Se aparecer um código no visor, indica-o à assistência."
sources:
