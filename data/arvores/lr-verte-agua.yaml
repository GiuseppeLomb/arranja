appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-verte-agua
ordem: 5
titulo: A máquina de lavar roupa verte água
sintoma: Verte água
inicio: onde
nos:
  onde:
    tipo: pergunta
    texto: De onde parece vir a água?
    ajuda: "Se a água continuar a sair, para a máquina e desliga-a da corrente: com fugas há risco de choque elétrico (Samsung). Fecha também a torneira (Bosch) e seca o chão antes de procurares a origem."
    respostas:
      - texto: Das ligações das mangueiras, atrás
        ir_para: fim-ligacoes
      - texto: Da frente, em baixo (zona do filtro)
        ir_para: fim-filtro
      - texto: Da porta
        ir_para: fim-porta
      - texto: Da gaveta do detergente ou com muita espuma
        ir_para: fim-espuma
      - texto: De onde a mangueira de escoamento descarrega
        ir_para: fim-escoamento
      - texto: Não consigo ver
        ir_para: fim-tecnico
  fim-ligacoes:
    tipo: guia
    guias:
      - lr-apertar-ligacoes-mangueiras
  fim-filtro:
    tipo: guia
    guias:
      - lr-limpar-filtro-bomba
    nota: Um filtro mal fechado pode deixar sair água pela frente.
  fim-porta:
    tipo: guia
    guias:
      - lr-limpar-borracha-porta
  fim-espuma:
    tipo: guia
    guias:
      - lr-reduzir-detergente-enxaguar
      - lr-limpar-gaveta-detergente
  fim-escoamento:
    tipo: guia
    guias:
      - lr-verificar-mangueira-escoamento
    nota: "Se o esgoto da casa estiver entupido, a água pode transbordar aí (LG): nesse caso chama um canalizador."
  fim-tecnico:
    tipo: tecnico
    motivo: "Se não encontras a origem, ou se a água sai da própria mangueira de entrada, não voltes a usar a máquina: desliga-a da corrente, fecha a torneira e contacta a assistência (ou um canalizador, se a fuga for da torneira). A Samsung avisa que continuar a usá-la pode causar choque elétrico."
