    titulo: Becken BDW1965N — Manual de instruções da máquina de lavar loiça (secção PT)
    pagina: 98, 110–112, 115, 138–139
    consultado_em: 2026-11-04
  - url: https://org.downloadcenter.samsung.com/downloadfile/ContentsFile.aspx?CDSite=UNI_UK&OriginYN=N&ModelType=N&ModelName=DW60M9550FS%2FEU&CttFileID=7019887&CDCttType=UM&VPath=UM%2F201804%2F20180409182326092%2FMANUAL_USERS_DD68-00203A-01_EU_EN_20180221.pdf
