# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-manchas-brancas
ordem: 6
titulo: Manchas ou película branca na loiça
sintoma: Manchas brancas na loiça
inicio: sal
nos:
  sal:
    tipo: pergunta
    texto: A luz do sal está acesa, ou o depósito do sal está vazio?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-sal
      - texto: Não
        ir_para: tampa
  tampa:
    tipo: pergunta
    texto: A tampa do depósito do sal está bem enroscada?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-sal
      - texto: Sim
        ir_para: detergente
  detergente:
    tipo: pergunta
    texto: Usas detergentes «tudo em um» ou ecológicos?
    respostas:
      - texto: Sim
        ir_para: fim-detergente
      - texto: Não
        ir_para: dureza
  dureza:
    tipo: pergunta
    texto: O nível de descalcificação está ajustado à dureza da água da tua zona?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-dureza
      - texto: Sim
        ir_para: dose
  dose:
    tipo: pergunta
    texto: Já ajustaste a dose de detergente e de abrilhantador?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-dose
      - texto: Sim
        ir_para: fim-tecnico
  fim-sal:
    tipo: guia
    guias:
      - ll-sal-abrilhantador
  fim-detergente:
    tipo: guia
    guias:
      - ll-programa-detergente
      - ll-sal-abrilhantador
    nota: "A Bosch indica que detergentes «tudo em um» ou ecológicos podem não bastar: usa produtos separados (detergente, sal e abrilhantador) ou ajusta a descalcificação."
  fim-dureza:
    tipo: guia
    guias:
      - ll-sal-abrilhantador
    nota: Ajusta o nível de descalcificação como indica o manual da tua máquina.
  fim-dose:
    tipo: guia
    guias:
      - ll-programa-detergente
      - ll-sal-abrilhantador
    nota: Com água macia, detergente a mais deixa manchas (Becken); detergente a menos ou um programa fraco também (Bosch). Ajusta a dose de abrilhantador como indica o manual.
  fim-tecnico:
    tipo: tecnico
    motivo: "Se as manchas continuam com o sal, o abrilhantador e a descalcificação bem regulados, contacta a assistência técnica. A Bosch explica que alguns resíduos só saem com limpeza mecânica e que a corrosão do vidro não se elimina. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
sources:
  - url: https://media3.bosch-home.com/Documents/9001036344_B.pdf
    titulo: Bosch — Instruções de serviço, máquina de lavar loiça SB…/SM… (PT)
    pagina: 16–17, 19, 39, 42, 45–47
    consultado_em: 2026-11-04
