# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-nao-seca
ordem: 5
titulo: A loiça não seca bem
sintoma: A loiça não seca
inicio: abrilhantador
nos:
  abrilhantador:
    tipo: pergunta
    texto: Há abrilhantador no depósito (a luz do abrilhantador está apagada)?
    ajuda: Gotas de água nas paredes interiores no fim do programa são normais em máquinas que secam por condensação (Bosch). O plástico seca sempre pior, porque retém menos calor.
    respostas:
      - texto: Não ou não sei
        ir_para: fim-abrilhantador
      - texto: Sim
        ir_para: programa
  programa:
    tipo: pergunta
    texto: O programa que escolheste tem secagem?
    ajuda: Nalgumas Samsung, desligar a abertura automática da porta piora a secagem; com várias pastilhas, a Samsung indica usar a opção de higienização ou abrilhantador.
    respostas:
      - texto: Não ou não sei
        ir_para: fim-programa
      - texto: Sim
        ir_para: carga
  carga:
    tipo: pergunta
    texto: A máquina ia muito cheia ou havia peças com cavidades viradas para cima?
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: espera
  espera:
    tipo: pergunta
    texto: Esperaste pelo fim do programa antes de abrir a porta e descarregar?
    respostas:
      - texto: Não
        ir_para: fim-espera
      - texto: Sim
        ir_para: fim-tecnico
  fim-abrilhantador:
    tipo: guia
    guias:
      - ll-sal-abrilhantador
  fim-programa:
    tipo: guia
    guias:
      - ll-programa-detergente
    nota: Escolhe um programa com secagem e, se a tua máquina tiver, a opção de secagem extra (Bosch).
  fim-carga:
    tipo: guia
    guias:
      - ll-arrumar-loica
  fim-espera:
    tipo: guia
    guias:
      - ll-arrumar-loica
    nota: "Espera pelo fim do programa: a Bosch sugere descarregar só cerca de 30 minutos depois. Esvazia primeiro o cesto de baixo."
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a loiça continua molhada, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
