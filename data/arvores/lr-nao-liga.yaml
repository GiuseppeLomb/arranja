# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-nao-liga
ordem: 1
titulo: A máquina de lavar roupa não liga ou não arranca
sintoma: Não liga ou não arranca
codigos:
  - becken-lr-e30
inicio: visor
nos:
  visor:
    tipo: pergunta
    texto: O visor ou as luzes acendem quando ligas a máquina?
    ajuda: "Nalgumas máquinas Bosch, o visor apagado com a tecla Início/Pausa a piscar é só o modo de poupança de energia: carrega nessa tecla e o visor volta a acender."
    respostas:
      - texto: Sim
        ir_para: bloqueio
      - texto: Não
        ir_para: fim-energia
  bloqueio:
    tipo: pergunta
    texto: Aparece o símbolo do bloqueio para crianças?
    respostas:
      - texto: Sim
        ir_para: fim-energia
      - texto: Não
        ir_para: porta
      - texto: Não sei
        ir_para: fim-energia
  porta:
    tipo: pergunta
    texto: A porta está bem fechada, sem roupa entalada?
    respostas:
      - texto: Sim
        ir_para: inicio
      - texto: Não
        ir_para: fim-energia
      - texto: Não sei
        ir_para: fim-energia
  inicio:
    tipo: pergunta
    texto: Carregaste na tecla de início e não tens um início diferido programado?
    ajuda: Algumas máquinas pedem para manter a tecla de início premida (Samsung). Com um fim ou início diferido ativo, a máquina espera antes de começar (Bosch).
    respostas:
      - texto: Sim
        ir_para: gaveta
      - texto: Não ou não sei
        ir_para: fim-inicio
  gaveta:
    tipo: pergunta
    texto: A gaveta do detergente está completamente fechada?
    respostas:
      - texto: Sim
        ir_para: torneira
      - texto: Não ou não sei
        ir_para: fim-gaveta
  torneira:
    tipo: pergunta
    texto: A torneira da água está totalmente aberta?
    respostas:
      - texto: Sim
        ir_para: fim-tecnico
      - texto: Não
        ir_para: fim-energia
  fim-energia:
    tipo: guia
    guias:
      - lr-verificar-energia-bloqueio
    nota: "Começa pelo mais simples: corrente, porta, bloqueio para crianças e torneira."
  fim-inicio:
    tipo: guia
    guias:
      - lr-verificar-energia-bloqueio
    nota: Carrega na tecla de início (nalgumas máquinas, mantém-na premida) e confirma se há um fim ou início diferido programado.
  fim-gaveta:
    tipo: guia
    guias:
      - lr-limpar-gaveta-detergente
    nota: Nalgumas máquinas (Bosch), o programa não arranca com a gaveta mal fechada. Empurra-a até ao fim; se não entrar bem, limpa a gaveta e o encaixe.
  fim-tecnico:
    tipo: tecnico
    motivo: Feitas estas verificações, se a máquina continua sem arrancar, os fabricantes mandam contactar a assistência técnica. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico. Se aparecer um código no visor, anota-o para o dares à assistência.
