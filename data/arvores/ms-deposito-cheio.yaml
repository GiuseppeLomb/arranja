appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-deposito-cheio
ordem: 9
titulo: Aviso de depósito cheio ou a água não escoa
sintoma: Aviso de depósito cheio
inicio: esvaziou
nos:
  esvaziou:
    tipo: pergunta
    texto: Já esvaziaste o depósito e voltaste a encaixá-lo até ao fim?
    respostas:
      - texto: Não
        ir_para: fim-deposito
      - texto: Sim
        ir_para: mangueira
  mangueira:
    tipo: pergunta
    texto: A máquina tem uma mangueira de escoamento ligada?
    respostas:
      - texto: Sim
        ir_para: fim-mangueira
      - texto: Não
        ir_para: fim-tecnico
  fim-deposito:
    tipo: guia
    guias:
      - ms-esvaziar-deposito
  fim-mangueira:
    tipo: guia
    guias:
      - ms-mangueira-escoamento
    nota: A Becken indica verificar a mangueira de saída da condensação se o aviso continuar depois de esvaziares o depósito.
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o aviso continua com o depósito vazio, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
