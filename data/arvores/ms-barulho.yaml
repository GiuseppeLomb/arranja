appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-barulho
ordem: 7
titulo: A máquina de secar faz barulho
sintoma: Barulho
inicio: objetos
nos:
  objetos:
    tipo: pergunta
    texto: Ouves objetos a bater (moedas, botões, peças metálicas)?
    ajuda: "Algum ruído é normal: o compressor e a bomba das máquinas com bomba de calor (Bosch) e o ar a passar pelo tambor e pela ventoinha (Samsung)."
    respostas:
      - texto: Sim
        ir_para: fim-objetos
      - texto: Não
        ir_para: nivel
  nivel:
    tipo: pergunta
    texto: A máquina está nivelada e firme no chão?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-nivel
      - texto: Sim
        ir_para: fim-tecnico
  fim-objetos:
    tipo: guia
    guias:
      - ms-limpar-filtro-cotao
      - ms-carga-programa
    nota: Retira os objetos do tambor e do filtro de cotão, e esvazia os bolsos antes de secar (Samsung).
  fim-nivel:
    tipo: guia
    guias:
      - ms-nivelar
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o barulho for anormal e continuar com a máquina nivelada e sem objetos soltos, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
sources:
