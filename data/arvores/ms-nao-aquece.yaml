# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-nao-aquece
ordem: 4
titulo: A máquina de secar não aquece
sintoma: Não aquece
codigos:
  - becken-ms-3h
inicio: bomba
nos:
  bomba:
    tipo: pergunta
    texto: A roupa está a secar, mesmo com a máquina fria ao toque?
    ajuda: As máquinas com bomba de calor secam a temperaturas baixas e podem estar frias ao toque (Bosch). No fim do programa há também uma fase de arrefecimento (Samsung).
    respostas:
      - texto: Sim
        ir_para: fim-normal
      - texto: Não
        ir_para: fusivel
  fusivel:
    tipo: pergunta
    texto: Algum fusível ou disjuntor disparou?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-energia
      - texto: Não
        ir_para: filtros
  filtros:
    tipo: pergunta
    texto: O filtro de cotão e a zona do permutador estão limpos?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-filtros
      - texto: Sim
        ir_para: fim-tecnico
  fim-normal:
    tipo: guia
    guias:
      - ms-carga-programa
    nota: "Não é avaria: as máquinas com bomba de calor secam a baixa temperatura."
  fim-energia:
    tipo: guia
    guias:
      - ms-verificar-energia-porta
  fim-filtros:
    tipo: guia
    guias:
      - ms-limpar-filtro-cotao
      - ms-limpar-permutador
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a máquina continua sem aquecer, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
sources:
