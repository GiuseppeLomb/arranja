# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-nao-liga
ordem: 1
titulo: A máquina de secar não liga ou não arranca
sintoma: Não liga ou não arranca
inicio: luzes
nos:
  luzes:
    tipo: pergunta
    texto: O painel acende quando ligas a máquina?
    respostas:
      - texto: Sim
        ir_para: porta
      - texto: Não
        ir_para: fim-energia
  porta:
    tipo: pergunta
    texto: A porta está bem fechada?
    respostas:
      - texto: Sim
        ir_para: bloqueio
      - texto: Não ou não sei
        ir_para: fim-energia
  bloqueio:
    tipo: pergunta
    texto: O bloqueio para crianças pode estar ativo?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-energia
      - texto: Não
        ir_para: deposito
  deposito:
    tipo: pergunta
    texto: Aparece o aviso de depósito cheio?
    respostas:
      - texto: Sim
        ir_para: fim-deposito
      - texto: Não
        ir_para: filtro
  filtro:
    tipo: pergunta
    texto: O filtro de cotão está limpo e bem encaixado?
    ajuda: A Samsung inclui a limpeza do filtro nas verificações quando a máquina não arranca.
    respostas:
      - texto: Não ou não sei
        ir_para: fim-filtro
      - texto: Sim
        ir_para: fim-tecnico
  fim-energia:
    tipo: guia
    guias:
      - ms-verificar-energia-porta
  fim-deposito:
    tipo: guia
    guias:
      - ms-esvaziar-deposito
  fim-filtro:
    tipo: guia
    guias:
      - ms-limpar-filtro-cotao
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a máquina continua sem arrancar, desliga-a, tira a ficha da tomada e contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
sources:
