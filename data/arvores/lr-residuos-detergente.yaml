appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-residuos-detergente
ordem: 10
titulo: A roupa sai com resíduos de detergente
sintoma: Roupa com resíduos de detergente
inicio: gaveta
nos:
  gaveta:
    tipo: pergunta
    texto: No fim do programa ficam restos de detergente na gaveta?
    respostas:
      - texto: Sim
        ir_para: limpa
      - texto: Não
        ir_para: fim-dose
  limpa:
    tipo: pergunta
    texto: Já limpaste a gaveta e a água entra com a pressão normal?
    respostas:
      - texto: Não
        ir_para: fim-gaveta
      - texto: Sim
        ir_para: fim-tecnico
  fim-gaveta:
    tipo: guia
    guias:
      - lr-limpar-gaveta-detergente
      - lr-limpar-filtro-entrada
    nota: Pouca água a entrar também deixa detergente na gaveta.
  fim-dose:
    tipo: guia
    guias:
      - lr-reduzir-detergente-enxaguar
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o detergente continua a ficar na gaveta, pode haver um problema nas válvulas da gaveta: a Beko manda contactar a assistência autorizada. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico."
