appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-frio-demais
ordem: 3
titulo: O frigorífico está frio demais ou congela os alimentos
sintoma: Frio demais
inicio: regulacao
nos:
  regulacao:
    tipo: pergunta
    texto: A temperatura está regulada muito fria ou a supercongelação está ativa?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-regulacao
      - texto: Não
        ir_para: fim-tecnico
  fim-regulacao:
    tipo: guia
    guias:
      - fr-regular-temperatura
    nota: Regula uma temperatura menos fria e verifica no dia seguinte (Bosch).
  fim-tecnico:
    tipo: tecnico
    motivo: Se continua frio demais com a regulação certa, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
