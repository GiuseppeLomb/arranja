# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-cheiro
ordem: 6
titulo: A máquina de secar ou a roupa cheiram mal
sintoma: Cheiro mau
inicio: filtro
nos:
  filtro:
    tipo: pergunta
    texto: Voltaste a pôr o filtro de cotão ainda molhado?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-filtro
      - texto: Não
        ir_para: roupa
  roupa:
    tipo: pergunta
    texto: A roupa ficou muito tempo molhada na máquina de lavar antes de ir para a de secar?
    respostas:
      - texto: Sim
        ir_para: fim-roupa
      - texto: Não
        ir_para: divisao
  divisao:
    tipo: pergunta
    texto: A divisão está arejada, sem cheiros fortes de tintas ou produtos de limpeza?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-divisao
      - texto: Sim
        ir_para: fim-tecnico
  fim-filtro:
    tipo: guia
    guias:
      - ms-limpar-filtro-cotao
    nota: "Um filtro molhado pode criar bolor e maus cheiros: deixa-o secar bem antes de o voltares a pôr (Samsung)."
  fim-roupa:
    tipo: guia
    guias:
      - ms-carga-programa
    nota: A Samsung desaconselha secar roupa que ficou muito tempo molhada na máquina.
  fim-divisao:
    tipo: guia
    guias:
      - ms-ventilar-divisao
    nota: Cheiros da divisão podem entrar na máquina com o ar (Samsung).
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o cheiro continua, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
