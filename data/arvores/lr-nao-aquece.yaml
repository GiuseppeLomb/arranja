appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-nao-aquece
ordem: 7
titulo: A máquina de lavar roupa não aquece a água
sintoma: Não aquece a água
inicio: programa
nos:
  programa:
    tipo: pergunta
    texto: O programa que escolheste tem uma temperatura acima do frio?
    ajuda: Alguns programas e opções lavam a frio ou a baixa temperatura de propósito.
    respostas:
      - texto: Sim
        ir_para: fim-tecnico
      - texto: Não ou não sei
        ir_para: fim-programa
  fim-programa:
    tipo: tecnico
    motivo: Escolhe um programa com temperatura e repete a lavagem. Se a roupa lavar bem mas a água continuar fria, a Becken indica como causas o sensor de temperatura (NTC) ou o elemento de aquecimento e manda contactar o apoio ao cliente. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico.
  fim-tecnico:
    tipo: tecnico
    motivo: Se a máquina lava normalmente mas a água continua fria num programa com temperatura, a Becken indica como causas o sensor de temperatura (NTC) ou o elemento de aquecimento e manda contactar o apoio ao cliente. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico. Se aparecer um código no visor, anota-o para o dares à assistência.
