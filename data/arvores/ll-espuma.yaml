# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-espuma
ordem: 10
titulo: Há espuma dentro da máquina de lavar loiça
sintoma: Espuma na máquina
inicio: detergente
nos:
  detergente:
    tipo: pergunta
    texto: Usaste detergente da loiça à mão ou outro que não seja para máquinas?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-espuma
      - texto: Não
        ir_para: abrilhantador
  abrilhantador:
    tipo: pergunta
    texto: Entornou abrilhantador ao encher o depósito?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-espuma
      - texto: Não
        ir_para: fim-tecnico
  fim-espuma:
    tipo: guia
    guias:
      - ll-eliminar-espuma
  fim-tecnico:
    tipo: tecnico
    motivo: "Se aparece espuma sem estas causas, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
sources:
