appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-motor-sempre
ordem: 11
titulo: O motor do frigorífico parece estar sempre a trabalhar
sintoma: Motor sempre a trabalhar
inicio: motivo
nos:
  motivo:
    tipo: pergunta
    texto: "Aconteceu algum destes casos: regulação muito fria, comida quente guardada há pouco, dia muito quente, porta aberta muitas vezes, ou aparelho ligado há pouco?"
    ajuda: É normal ouvir o motor com frequência; nestes casos trabalha mais tempo (Becken).
    respostas:
      - texto: Sim
        ir_para: fim-motivo
      - texto: Não
        ir_para: local
  local:
    tipo: pergunta
    texto: O aparelho tem espaço à volta e a traseira está sem pó?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-local
      - texto: Sim
        ir_para: fim-tecnico
  fim-motivo:
    tipo: guia
    guias:
      - fr-regular-temperatura
      - fr-arrumar-alimentos
  fim-local:
    tipo: guia
    guias:
      - fr-instalacao-ventilacao
  fim-tecnico:
    tipo: tecnico
    motivo: Se o motor continua sem parar sem nenhum destes motivos, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
