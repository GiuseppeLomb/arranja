# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-nao-escoa
ordem: 3
titulo: A máquina de lavar roupa não escoa a água
sintoma: Não escoa a água
codigos:
  - bosch-lr-e30-80
  - bosch-lr-e36
  - becken-lr-e21
  - electrolux-lr-e20
  - aeg-lr-e20
  - zanussi-lr-e20
  - hotpoint-lr-f05
  - hoover-lr-e3
  - siemens-lr-e18
  - gorenje-lr-e7
inicio: opcao
nos:
  opcao:
    tipo: pergunta
    texto: Escolheste uma opção que para com água no tambor, como «sem centrifugação final» ou «paragem no enxaguamento»?
    ajuda: Com esta opção a água fica no tambor de propósito, até continuares o programa (Bosch).
    respostas:
      - texto: Sim
        ir_para: fim-opcao
      - texto: Não ou não sei
        ir_para: mangueira
  mangueira:
    tipo: pergunta
    texto: A mangueira de escoamento está dobrada, entalada, entupida ou ligada demasiado alta?
    ajuda: A Bosch indica no máximo 1 metro de altura e não aceita extensões que não estejam previstas.
    respostas:
      - texto: Sim
        ir_para: fim-mangueira
      - texto: Não sei
        ir_para: fim-mangueira
      - texto: Não
        ir_para: filtro
  filtro:
    tipo: pergunta
    texto: Já limpaste o filtro da bomba de escoamento e voltaste a enroscar bem a tampa?
    respostas:
      - texto: Não
        ir_para: fim-filtro
      - texto: Sim
        ir_para: espuma
  espuma:
    tipo: pergunta
    texto: Puseste muito detergente ou há muita espuma no tambor?
    respostas:
      - texto: Sim
        ir_para: fim-espuma
      - texto: Não
        ir_para: esgoto
  esgoto:
    tipo: pergunta
    texto: O esgoto da casa escoa bem (por exemplo, o lava-loiça ao lado)?
    respostas:
      - texto: Sim
        ir_para: fim-tecnico
      - texto: Não
        ir_para: fim-canalizador
  fim-opcao:
    tipo: guia
    guias:
      - lr-equilibrar-carga
    nota: "Não é avaria: continua o programa escolhendo «Centrifugação» ou «Escoamento» (Bosch)."
  fim-mangueira:
    tipo: guia
    guias:
      - lr-verificar-mangueira-escoamento
  fim-filtro:
    tipo: guia
    guias:
      - lr-esvaziar-agua
      - lr-limpar-filtro-bomba
    nota: Primeiro esvazia a água, depois limpa o filtro.
  fim-espuma:
    tipo: guia
    guias:
      - lr-reduzir-detergente-enxaguar
    nota: Detergente a mais também impede a água de escoar (Bosch).
  fim-canalizador:
    tipo: tecnico
    motivo: Se o esgoto da casa também escoa mal, o entupimento está na canalização. Chama um canalizador.
  fim-tecnico:
    tipo: tecnico
    motivo: Com a mangueira desimpedida, o filtro limpo e o esgoto a funcionar, os fabricantes mandam contactar a assistência técnica. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico. Se aparecer um código no visor, anota-o para o dares à assistência.
