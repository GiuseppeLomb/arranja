# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-nao-enche-agua
ordem: 2
titulo: A máquina de lavar roupa não enche água
sintoma: Não enche água
codigos:
  - bosch-lr-e30-10
  - becken-lr-e10
inicio: torneira
nos:
  torneira:
    tipo: pergunta
    texto: A torneira da água está totalmente aberta?
    ajuda: No início do programa, algumas máquinas rodam o tambor até 2 minutos sem entrar água para detetarem a carga. A Bosch indica que isso é normal.
    respostas:
      - texto: Sim
        ir_para: mangueira
      - texto: Não ou não sei
        ir_para: fim-torneira
  mangueira:
    tipo: pergunta
    texto: A mangueira de entrada está direita, sem dobras e sem estar entalada atrás da máquina?
    respostas:
      - texto: Sim
        ir_para: rede
      - texto: Não ou não sei
        ir_para: fim-mangueira
  rede:
    tipo: pergunta
    texto: Noutra torneira da casa a água sai com a pressão normal?
    respostas:
      - texto: Sim
        ir_para: filtro
      - texto: Não
        ir_para: fim-rede
  filtro:
    tipo: pergunta
    texto: Já limpaste o filtro da entrada de água?
    respostas:
      - texto: Não
        ir_para: fim-filtro
      - texto: Sim, e continua igual
        ir_para: fim-tecnico
  fim-torneira:
    tipo: guia
    guias:
      - lr-verificar-energia-bloqueio
    nota: Abre a torneira toda e volta a iniciar o programa.
  fim-mangueira:
    tipo: guia
    guias:
      - lr-apertar-ligacoes-mangueiras
    nota: A mangueira de entrada não pode ficar dobrada nem entalada.
  fim-rede:
    tipo: tecnico
    motivo: Se falta água ou pressão noutras torneiras, o problema está na canalização ou no abastecimento da casa, não na máquina. Fala com um canalizador ou com a entidade que fornece a água.
  fim-filtro:
    tipo: guia
    guias:
      - lr-limpar-filtro-entrada
  fim-tecnico:
    tipo: tecnico
    motivo: Com água na torneira, a mangueira direita e o filtro limpo, os fabricantes mandam contactar a assistência técnica. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico. Se aparecer um código no visor, anota-o para o dares à assistência.
