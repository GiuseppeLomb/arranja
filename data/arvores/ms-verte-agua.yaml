# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-verte-agua
ordem: 4
titulo: A máquina de secar verte água
sintoma: Verte água
inicio: onde
nos:
  onde:
    tipo: pergunta
    texto: A água está no chão, por baixo ou à volta da máquina?
    ajuda: Gotas de água à volta do permutador de calor (Samsung) ou entre o vidro e o vedante da porta (Becken) são normais.
    respostas:
      - texto: Sim
        ir_para: nivel
      - texto: Não, só gotas junto à porta ou ao permutador
        ir_para: fim-normal
  nivel:
    tipo: pergunta
    texto: A máquina está nivelada?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-nivel
      - texto: Sim
        ir_para: tampa
  tampa:
    tipo: pergunta
    texto: A tampa da zona do permutador está bem fechada e limpa?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-tampa
      - texto: Sim
        ir_para: mangueira
  mangueira:
    tipo: pergunta
    texto: A máquina tem uma mangueira de escoamento ligada?
    respostas:
      - texto: Sim
        ir_para: fim-mangueira
      - texto: Não
        ir_para: deposito
  deposito:
    tipo: pergunta
    texto: O depósito da água está bem encaixado?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-deposito
      - texto: Sim
        ir_para: fim-tecnico
  fim-normal:
    tipo: guia
    guias:
      - ms-limpar-permutador
    nota: Gotas de condensação são normais. Mantém limpos os vedantes da porta e a zona do permutador (Becken).
  fim-nivel:
    tipo: guia
    guias:
      - ms-nivelar
  fim-tampa:
    tipo: guia
    guias:
      - ms-limpar-permutador
  fim-mangueira:
    tipo: guia
    guias:
      - ms-mangueira-escoamento
  fim-deposito:
    tipo: guia
    guias:
      - ms-esvaziar-deposito
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a água continua a sair, desliga a máquina e contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
