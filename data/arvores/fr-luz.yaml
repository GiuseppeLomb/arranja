id: fr-luz
ordem: 12
titulo: A luz do frigorífico não acende
sintoma: A luz não acende
inicio: painel
nos:
  painel:
    tipo: pergunta
    texto: O aparelho está a arrefecer e o painel ou as indicações acendem?
    ajuda: A luz interior acende quando abres a porta (Bosch).
    respostas:
      - texto: Não
        ir_para: fim-energia
      - texto: Sim
        ir_para: fim-tecnico
  fim-energia:
    tipo: guia
    guias:
      - fr-verificar-energia
    nota: Se nenhuma indicação acende, o problema pode ser a corrente (Bosch).
  fim-tecnico:
    tipo: tecnico
    motivo: "Com o aparelho a funcionar, a luz é a avaria: a iluminação é LED e os fabricantes indicam que não é substituível pelo utilizador. Contacta a assistência para a substituir (Bosch, Samsung, Becken)."
