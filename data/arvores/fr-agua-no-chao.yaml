appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-agua-no-chao
ordem: 6
titulo: Há água no chão junto ao frigorífico
sintoma: Água no chão
inicio: desligado
nos:
  desligado:
    tipo: pergunta
    texto: O aparelho esteve desligado há pouco tempo?
    ajuda: Depois de estar desligado muito tempo, o gelo derrete e a água pode escorrer para o chão (Becken).
    respostas:
      - texto: Sim
        ir_para: fim-desligado
      - texto: Não
        ir_para: orificio
  orificio:
    tipo: pergunta
    texto: O orifício de escoamento no fundo do frigorífico está limpo?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-orificio
      - texto: Sim
        ir_para: fim-tecnico
  fim-desligado:
    tipo: guia
    guias:
      - fr-descongelar-congelador
    nota: Seca a água e confirma se o gelo derretido explica a água no chão.
  fim-orificio:
    tipo: guia
    guias:
      - fr-limpar-orificio-descongelacao
    nota: Com o orifício entupido, a água pode acabar no chão (Becken).
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a água continua, contacta a assistência. A Becken explica que pode vir do reservatório ou do tubo de escoamento atrás, junto ao compressor: zona com o circuito de refrigeração (gás inflamável) e peças quentes, só para técnicos."
