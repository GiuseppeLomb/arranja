# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-nao-liga
ordem: 1
titulo: O frigorífico não liga
sintoma: Não liga (sem luzes)
inicio: luzes
nos:
  luzes:
    tipo: pergunta
    texto: Alguma luz ou o painel acende?
    respostas:
      - texto: Não
        ir_para: energia
      - texto: Sim
        ir_para: fim-arrefece
  energia:
    tipo: pergunta
    texto: Já confirmaste a ficha, a tomada e o fusível?
    respostas:
      - texto: Não
        ir_para: fim-energia
      - texto: Sim
        ir_para: fim-tecnico
  fim-energia:
    tipo: guia
    guias:
      - fr-verificar-energia
  fim-tecnico:
    tipo: tecnico
    motivo: Se a tomada e o fusível estão bem e o aparelho continua sem luzes, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
  fim-arrefece:
    tipo: guia
    guias:
      - fr-regular-temperatura
      - fr-instalacao-ventilacao
    nota: Se o painel acende mas o aparelho não arrefece, vê o sintoma «Arrefece pouco».
