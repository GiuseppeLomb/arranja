# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-detergente-fica
ordem: 11
titulo: O detergente fica no dispensador
sintoma: O detergente não se dissolve
inicio: tampa
nos:
  tampa:
    tipo: pergunta
    texto: Alguma peça de loiça tapa a tampa do dispensador?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-carga
      - texto: Não
        ir_para: pastilha
  pastilha:
    tipo: pergunta
    texto: Usaste uma pastilha num programa curto ou rápido?
    respostas:
      - texto: Sim
        ir_para: fim-programa
      - texto: Não
        ir_para: humido
  humido:
    tipo: pergunta
    texto: O dispensador estava molhado quando puseste o detergente?
    respostas:
      - texto: Sim
        ir_para: fim-programa
      - texto: Não
        ir_para: bracos
  bracos:
    tipo: pergunta
    texto: Os braços aspersores rodam livremente?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-bracos
      - texto: Sim
        ir_para: fim-tecnico
  fim-carga:
    tipo: guia
    guias:
      - ll-arrumar-loica
    nota: Nas Bosch, a pastilha deve ficar deitada na transversal, não de canto.
  fim-programa:
    tipo: guia
    guias:
      - ll-programa-detergente
  fim-bracos:
    tipo: guia
    guias:
      - ll-limpar-bracos-aspersores
      - ll-arrumar-loica
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o detergente continua a ficar no dispensador, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
