# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-nao-enche-agua
ordem: 2
titulo: A máquina de lavar loiça não enche água
sintoma: Não enche água
codigos:
  - becken-ll-e2
  - samsung-ll-4c
  - samsung-ll-4c5
inicio: torneira
nos:
  torneira:
    tipo: pergunta
    texto: A torneira da máquina está totalmente aberta?
    respostas:
      - texto: Sim
        ir_para: mangueira
      - texto: Não ou não sei
        ir_para: fim-entrada
  mangueira:
    tipo: pergunta
    texto: A mangueira de admissão está direita, sem dobras?
    respostas:
      - texto: Sim
        ir_para: rede
      - texto: Não ou não sei
        ir_para: fim-entrada
  rede:
    tipo: pergunta
    texto: Noutra torneira da casa a água sai com a pressão normal?
    respostas:
      - texto: Sim
        ir_para: filtro
      - texto: Não
        ir_para: fim-rede
  filtro:
    tipo: pergunta
    texto: Já limpaste o filtro da entrada de água, na ligação da mangueira?
    respostas:
      - texto: Não
        ir_para: fim-entrada
      - texto: Sim
        ir_para: fim-tecnico
  fim-entrada:
    tipo: guia
    guias:
      - ll-verificar-entrada-agua
  fim-rede:
    tipo: tecnico
    motivo: Se falta água ou pressão noutras torneiras, o problema está na canalização ou no abastecimento da casa, não na máquina. Fala com um canalizador ou com a entidade que fornece a água.
  fim-tecnico:
    tipo: tecnico
    motivo: "Com a torneira aberta, a mangueira direita e o filtro limpo, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados. Se aparecer um código no visor, indica-o à assistência."
