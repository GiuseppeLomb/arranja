# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-verte-agua
ordem: 7
titulo: A máquina de lavar loiça verte água
sintoma: Verte água
codigos:
  - becken-ll-e5
  - becken-ll-e6
  - samsung-ll-lc
inicio: onde
nos:
  onde:
    tipo: pergunta
    texto: De onde parece vir a água?
    ajuda: Se houver água no chão, fecha a torneira e desliga a máquina no disjuntor antes de chamares a assistência. Tira a água da base antes de voltares a ligar (Becken, Samsung).
    respostas:
      - texto: Da porta, com espuma
        ir_para: fim-espuma
      - texto: Da porta, sem espuma
        ir_para: fim-vedante
      - texto: Das ligações das mangueiras
        ir_para: fim-mangueiras
      - texto: Não consigo ver
        ir_para: nivel
  nivel:
    tipo: pergunta
    texto: A máquina está nivelada?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-nivel
      - texto: Sim
        ir_para: fim-tecnico
  fim-espuma:
    tipo: guia
    guias:
      - ll-eliminar-espuma
  fim-vedante:
    tipo: guia
    guias:
      - ll-limpeza-cuba-vedante
      - ll-arrumar-loica
    nota: Restos no vedante ou peças altas que deformam a vedação da porta podem deixar sair água (Samsung).
  fim-mangueiras:
    tipo: guia
    guias:
      - ll-verificar-entrada-agua
      - ll-verificar-mangueira-escoamento
  fim-nivel:
    tipo: guia
    guias:
      - ll-nivelar
    nota: A Becken indica que uma máquina desnivelada pode verter água.
  fim-tecnico:
    tipo: tecnico
    motivo: "Se não encontras a origem, fecha a torneira, desliga a máquina no disjuntor e contacta a assistência ou o instalador, como indica a Samsung. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
