# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-condensacao
ordem: 10
titulo: Forma-se água (condensação) no aparelho
sintoma: Condensação
inicio: onde
nos:
  onde:
    tipo: pergunta
    texto: Onde aparece a água?
    ajuda: "É normal as paredes laterais ou a frente aquecerem: têm tubos de calor para evitar condensação (Samsung, Becken)."
    respostas:
      - texto: Nas paredes ou prateleiras de dentro
        ir_para: dentro
      - texto: Do lado de fora do aparelho
        ir_para: fim-fora
  dentro:
    tipo: pergunta
    texto: A porta fica aberta muito tempo, ou há alimentos húmidos destapados?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-arrumar
      - texto: Não
        ir_para: vedante
  vedante:
    tipo: pergunta
    texto: O vedante está limpo e a porta fecha bem?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-vedante
      - texto: Sim
        ir_para: fim-tecnico
  fim-fora:
    tipo: guia
    guias:
      - fr-instalacao-ventilacao
    nota: "Em dias quentes e húmidos é normal: limpa com um pano seco e abre a porta o menos possível (Bosch)."
  fim-arrumar:
    tipo: guia
    guias:
      - fr-arrumar-alimentos
  fim-vedante:
    tipo: guia
    guias:
      - fr-limpar-vedante
  fim-tecnico:
    tipo: tecnico
    motivo: Se a condensação continua com a porta a fechar bem, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
