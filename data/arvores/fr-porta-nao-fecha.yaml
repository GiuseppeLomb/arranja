# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-porta-nao-fecha
ordem: 9
titulo: A porta do frigorífico não fecha bem
sintoma: A porta não fecha bem
inicio: obstaculo
nos:
  obstaculo:
    tipo: pergunta
    texto: Algum alimento, prateleira ou gaveta impede a porta de fechar?
    respostas:
      - texto: Sim ou não sei
        ir_para: fim-arrumar
      - texto: Não
        ir_para: nivel
  nivel:
    tipo: pergunta
    texto: O aparelho está nivelado e ligeiramente inclinado para trás?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-nivel
      - texto: Sim
        ir_para: vedante
  vedante:
    tipo: pergunta
    texto: O vedante está limpo e inteiro?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-vedante
      - texto: Sim
        ir_para: fim-tecnico
  fim-arrumar:
    tipo: guia
    guias:
      - fr-arrumar-alimentos
  fim-nivel:
    tipo: guia
    guias:
      - fr-nivelar
  fim-vedante:
    tipo: guia
    guias:
      - fr-limpar-vedante
    nota: Se o vedante estiver rasgado, a substituição é com a assistência.
  fim-tecnico:
    tipo: tecnico
    motivo: Se a porta continua a não fechar, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
