appliance_type: maquina-secar
aplicavel_a:
  - brand: "*"
id: ms-humidade-divisao
ordem: 9
titulo: A divisão fica húmida ou quente quando a máquina seca
sintoma: A divisão fica húmida
inicio: arejada
nos:
  arejada:
    tipo: pergunta
    texto: A divisão tem janela ou porta aberta enquanto a máquina trabalha?
    respostas:
      - texto: Não
        ir_para: fim-ventilar
      - texto: Sim
        ir_para: base
  base:
    tipo: pergunta
    texto: A zona do permutador está limpa e com todas as peças bem colocadas?
    ajuda: A Becken indica limpar a grelha de arrefecimento e confirmar que o condensador está colocado quando a humidade da divisão sobe.
    respostas:
      - texto: Não ou não sei
        ir_para: fim-base
      - texto: Sim
        ir_para: fim-tecnico
  fim-ventilar:
    tipo: guia
    guias:
      - ms-ventilar-divisao
    nota: "As máquinas com bomba de calor trocam ar com a divisão: num espaço pouco arejado, a humidade sobe (Samsung)."
  fim-base:
    tipo: guia
    guias:
      - ms-limpar-permutador
  fim-tecnico:
    tipo: tecnico
    motivo: "Se a humidade continua a subir com a divisão arejada, contacta a assistência. Os fabricantes avisam que não deves abrir a máquina: há risco de choque elétrico e as reparações são só para técnicos autorizados."
