appliance_type: maquina-lavar-loica
aplicavel_a:
  - brand: "*"
id: ll-barulho
ordem: 8
titulo: A máquina de lavar loiça faz barulho
sintoma: Barulho
inicio: bater
nos:
  bater:
    tipo: pergunta
    texto: Ouves batidas ou um matraquear durante a lavagem?
    ajuda: "Alguns sons são normais: a abertura do dispensador do detergente, a bomba a escoar e, nalgumas instalações, as batidas das válvulas de entrada de água (Bosch, Becken, Samsung)."
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: nivel
  nivel:
    tipo: pergunta
    texto: A máquina está nivelada?
    respostas:
      - texto: Não ou não sei
        ir_para: fim-nivel
      - texto: Sim
        ir_para: fim-tecnico
  fim-carga:
    tipo: guia
    guias:
      - ll-arrumar-loica
    nota: Pode ser um braço aspersor a bater na loiça ou peças leves a mexer-se.
  fim-nivel:
    tipo: guia
    guias:
      - ll-nivelar
  fim-tecnico:
    tipo: tecnico
    motivo: "Se o barulho for anormal e continuar com a loiça bem arrumada e a máquina nivelada, contacta a assistência técnica. Os fabricantes avisam que reparações impróprias são perigosas e que o interior não tem peças que o utilizador possa reparar: as reparações são para técnicos especializados."
