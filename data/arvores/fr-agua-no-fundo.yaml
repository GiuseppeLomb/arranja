appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-agua-no-fundo
ordem: 5
titulo: Há água no fundo do frigorífico
sintoma: Água no fundo do frigorífico
inicio: orificio
nos:
  orificio:
    tipo: pergunta
    texto: Já limpaste o orifício de escoamento no fundo do frigorífico?
    respostas:
      - texto: Não
        ir_para: fim-orificio
      - texto: Sim
        ir_para: fim-tecnico
  fim-orificio:
    tipo: guia
    guias:
      - fr-limpar-orificio-descongelacao
    nota: A água da descongelação automática sai por esse orifício; entupido, a água junta-se no fundo (Bosch, Becken).
  fim-tecnico:
    tipo: tecnico
    motivo: Se a água continua a juntar-se com o orifício limpo, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
