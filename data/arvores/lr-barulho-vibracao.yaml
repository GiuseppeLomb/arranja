# Gerado a partir de manuais oficiais (ver sources). Texto próprio em PT-PT.
# Esquema: schemas/diagnostic_tree.schema.json
appliance_type: maquina-lavar-roupa
aplicavel_a:
  - brand: "*"
id: lr-barulho-vibracao
ordem: 6
titulo: A máquina de lavar roupa faz barulho ou vibra muito
sintoma: Barulho ou vibração forte
inicio: nova
nos:
  nova:
    tipo: pergunta
    texto: A máquina é nova ou foi mudada de sítio há pouco tempo?
    respostas:
      - texto: Sim
        ir_para: fim-transporte
      - texto: Não
        ir_para: abana
  abana:
    tipo: pergunta
    texto: A máquina abana ou anda durante a centrifugação?
    respostas:
      - texto: Sim
        ir_para: fim-transporte
      - texto: Não
        ir_para: chocalho
  chocalho:
    tipo: pergunta
    texto: Ouves um chocalhar ou um bater metálico?
    respostas:
      - texto: Sim
        ir_para: fim-objetos
      - texto: Não
        ir_para: carga
  carga:
    tipo: pergunta
    texto: Acontece sobretudo com pouca roupa ou com uma peça pesada?
    respostas:
      - texto: Sim
        ir_para: fim-carga
      - texto: Não
        ir_para: fim-tecnico
  fim-transporte:
    tipo: guia
    guias:
      - lr-nivelar-parafusos-transporte
  fim-objetos:
    tipo: guia
    guias:
      - lr-esvaziar-agua
      - lr-limpar-filtro-bomba
    nota: Moedas e outros objetos metálicos fazem barulho e ficam no tambor ou no filtro da bomba (Samsung, Bosch).
  fim-carga:
    tipo: guia
    guias:
      - lr-equilibrar-carga
  fim-tecnico:
    tipo: tecnico
    motivo: "Alguns ruídos são normais: motor, bomba a escoar, água a entrar na gaveta, roupa com peças metálicas (Bosch, Samsung). Se o barulho for anormal e continuar com a máquina nivelada, sem objetos e com a carga equilibrada, contacta a assistência técnica. As reparações dentro da máquina só podem ser feitas por técnicos qualificados, por risco de choque elétrico."
