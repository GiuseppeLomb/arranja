appliance_type: frigorifico
aplicavel_a:
  - brand: "*"
id: fr-cheiro
ordem: 8
titulo: O frigorífico cheira mal
sintoma: Cheiro mau
inicio: limpo
nos:
  limpo:
    tipo: pergunta
    texto: Já limpaste o interior e deitaste fora o que estava estragado?
    respostas:
      - texto: Não
        ir_para: fim-limpar
      - texto: Sim
        ir_para: tapados
  tapados:
    tipo: pergunta
    texto: Os alimentos com cheiro forte estão bem tapados?
    respostas:
      - texto: Não
        ir_para: fim-arrumar
      - texto: Sim
        ir_para: fim-tecnico
  fim-limpar:
    tipo: guia
    guias:
      - fr-limpar-interior
  fim-arrumar:
    tipo: guia
    guias:
      - fr-arrumar-alimentos
  fim-tecnico:
    tipo: tecnico
    motivo: Se o cheiro persiste depois da limpeza, contacta a assistência. O circuito de refrigeração tem gás refrigerante inflamável e os fabricantes avisam que só técnicos podem mexer nele; não tentes reparar o aparelho por tua conta.
