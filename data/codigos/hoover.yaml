- id: hoover-lr-e2
  brand: hoover
  appliance_type: maquina-lavar-roupa
  code: E2
  descricao: A máquina não consegue encher. Confirma que a torneira está aberta, que a mangueira de entrada não está dobrada nem entalada, que a mangueira de escoamento está à altura certa e que o filtro «anti-areia» da entrada está limpo. (Indicado no manual Hoover HBWMO96TAHC; nos modelos sem visor, o código aparece como número de piscas das luzes.)
  aliases:
    - E02
  arvore: lr-nao-enche-agua
  guias:
    - lr-limpar-filtro-entrada
    - lr-apertar-ligacoes-mangueiras
    - lr-verificar-mangueira-escoamento
  sources:
    - url: https://service.hoover.co.uk/media/cf1fm5fk/hbwmo96tahc.pdf
      titulo: Hoover HBWMO96TAHC — Instruction manual (EN)
      pagina: "24"
      consultado_em: 2026-11-05
    - url: https://service.hoover.co.uk/advice-centre/error-message-e02-appears-in-the-display-on-the-washing-machine/
      titulo: "Hoover — Advice Centre: error message E02"
      consultado_em: 2026-11-05
  ambito: modelos
  ambito_nota: Hoover HBWMO…T-AH, de 6 a 9 kg (manual HBWMO96TAHC); 446 modelos Hoover listados no Centro de Apoio
  aplicavel_a:
    - brand: hoover
      regex:
        - ^HBWMO[6-9]\dTAH
      familias:
        - hoover-lr-centro-apoio
