- id: hoover-lr-e7
  brand: hoover
  appliance_type: maquina-lavar-roupa
  code: E7
  descricao: Problema na porta. Confirma que a porta está bem fechada e que a roupa não a impede de fechar. Se a porta estiver trancada, desliga a máquina e a ficha, espera 2 a 3 minutos e volta a abrir. (Indicado no manual Hoover HBWMO96TAHC; nos modelos sem visor, o código aparece como número de piscas das luzes.)
