- id: electrolux-lr-e10
  brand: electrolux
  appliance_type: maquina-lavar-roupa
  code: E10
  aliases:
    - E11
  descricao: Não entra água, ou entra pouca. Confirma que a torneira dá água suficiente (um balde de 10 litros em cerca de um minuto), limpa os filtros da mangueira de entrada e confirma que a mangueira de escoamento não entra mais de 10 cm no esgoto e fica entre 60 e 100 cm de altura. Depois, desliga a ficha 30 segundos e volta a ligar. Se continuar, chama a assistência; a marca desaconselha usar a máquina até o problema estar resolvido.
  arvore: lr-nao-enche-agua
  guias:
    - lr-limpar-filtro-entrada
