- id: miele-ll-entrada-agua
  brand: miele
  appliance_type: maquina-lavar-loica
  code: Entrada água
  descricao: Anomalia na entrada de água (se o visor indicar «Abrir torneira água», a torneira está fechada). Antes de tudo, desliga a máquina. Abre a torneira toda e recomeça o programa; limpa o filtro da entrada de água. Se a pressão da água for inferior a 50 kPa, fala com um técnico. A Miele indica ainda que, se a ligação ao esgoto estiver demasiado baixa, o esgoto precisa de ventilação (vê o manual). (Indicado no manual Miele M.-Nr. 11 941 802.)
