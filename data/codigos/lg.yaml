- id: lg-lr-ff
  brand: lg
  appliance_type: maquina-lavar-roupa
  code: FF
  descricao: Água congelada na mangueira de entrada, na de escoamento ou na bomba, por causa do frio. Põe água morna no tambor para descongelar a bomba e envolve a mangueira de entrada numa toalha embebida em água morna. Para não voltar a congelar, em tempo de geada escoa com antecedência a água que fica na máquina, pelo tubo de esvaziamento de emergência. Se o código voltar depois destes passos, desliga a máquina da tomada e contacta a assistência LG. (Página oficial de apoio da LG Reino Unido.)
  sources:
