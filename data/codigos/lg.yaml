- id: lg-lr-ie
  brand: lg
  appliance_type: maquina-lavar-roupa
  code: IE
  descricao: "Erro de entrada de água: a torneira pode estar fechada, a mangueira de entrada dobrada ou o filtro de entrada entupido. Abre a torneira toda e endireita a mangueira; se continuar, fecha a torneira, solta a mangueira e limpa o filtro que está lá dentro. Se o código voltar depois destes passos, desliga a máquina da tomada e contacta a assistência LG. (Página oficial de apoio da LG Reino Unido.)"
  arvore: lr-nao-enche-agua
  guias:
    - lr-limpar-filtro-entrada
  sources:
    - &a1
      url: https://www.lg.com/uk/support/product-support/troubleshoot/help-library/cs-CT00008362-20152500935902DRC/
      titulo: LG UK — LG Washing Machine Troubleshooting (Common Error Messages) (página de apoio)
      consultado_em: 2026-11-08
  ambito: sem-modelos
  ambito_nota: página geral de apoio da LG Reino Unido sobre códigos das máquinas de lavar roupa, sem lista de modelos
- id: lg-lr-ue
  brand: lg
  appliance_type: maquina-lavar-roupa
  code: UE
  descricao: "Desequilíbrio: a carga pode ser pequena demais ou estar mal distribuída, e o tambor não consegue centrifugar bem. Se a carga for pequena, junta uma ou duas peças parecidas; se a roupa molhada estiver emaranhada, distribui-a pelo tambor e recomeça o programa. Se o código voltar depois destes passos, desliga a máquina da tomada e contacta a assistência LG. (Página oficial de apoio da LG Reino Unido e manual da LG Mini F8K5XN3, ref. MFL68881095.)"
  arvore: lr-nao-centrifuga
  guias:
    - lr-equilibrar-carga
  sources:
    - *a1
    - url: https://www.auchan.pt/on/demandware.static/-/Library-Sites-AuchanPTSharedLibrary/default/dwe3ad2e70/documents/002736577_89c8c892-f0d8-4e67-83f0-dba469fb6eca.pdf
