- id: lg-lr-oe
  brand: lg
  appliance_type: maquina-lavar-roupa
  code: OE
  descricao: "Erro de escoamento: a mangueira de escoamento pode estar dobrada ou entupida, ou o filtro da bomba de escoamento sujo. Confirma que a mangueira não está dobrada nem entupida e tira a sujidade do filtro da bomba. Se o código voltar depois destes passos, desliga a máquina da tomada e contacta a assistência LG. (Página oficial de apoio da LG Reino Unido.)"
  arvore: lr-nao-escoa
