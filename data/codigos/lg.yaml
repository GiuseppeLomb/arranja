- id: lg-lr-ue
  brand: lg
  appliance_type: maquina-lavar-roupa
  code: UE
  descricao: "Desequilíbrio: a máquina não conseguiu equilibrar a carga e pode parar ou cancelar a centrifugação. Redistribui a roupa; se a carga for uma peça pesada sozinha (como um tapete de casa de banho ou um roupão), junta-lhe 1 ou 2 peças parecidas ou mais pequenas. Fecha a porta e carrega em Início/Pausa. (Indicado nos manuais LG F4WR5013A6W, ref. MFL71766782, F4WR35…, ref. MFL72012058, e LG Mini F8K5XN3, ref. MFL68881095.)"
