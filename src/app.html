<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#14302B" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F1A18" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Guias de reparação DIY de eletrodomésticos. Antes de deitar fora, arranja." />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<script>try{var t=localStorage.getItem('arranja:tema');if(t==='claro'||t==='escuro'){document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark')}}catch(e){}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
