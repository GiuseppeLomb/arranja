<!--
  Arranja — Cozinha (ilustração original, CC BY-NC-SA 4.0).
  Fonte legível: este ficheiro. A app usa cozinha.min.svg, gerado com `npm run svg` (svgo).

  Regras:
  - Cores só por classes (k-*), definidas com tokens CSS em src/lib/design/tokens.css → modo escuro sem segunda imagem.
  - Cada eletrodoméstico navegável é um <a class="k-ap" data-tipo> com:
      .k-sombra (sombra no chão), .k-corpo (o aparelho), .k-halo (contorno cobre) e .k-anel (anel de foco).
  - Aparelhos "Brevemente" (forno, exaustor): <g class="k-breve" data-brevemente>, não navegáveis.
  - Sem marcas nem logótipos.
  - viewBox 300×400 (3:4). Em paisagem o CSS usa preserveAspectRatio slice e corta o topo decorativo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMax slice" class="k-svg" role="group" aria-labelledby="k-titulo">
  <title id="k-titulo">Cozinha: escolhe o eletrodoméstico avariado</title>
