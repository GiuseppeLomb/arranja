      <path class="k-azulejo-2" d="M7 3.4 10.6 7 7 10.6 3.4 7z"/>
      <circle class="k-azulejo" cx="7" cy="7" r="1.3"/>
      <path class="k-junta" d="M0 0h14v14"/>
    </pattern>
    <clipPath id="k-clip-ls"><circle cx="209" cy="337" r="16.5"/></clipPath>
    <clipPath id="k-clip-lr"><circle cx="267" cy="337" r="16.5"/></clipPath>
    <clipPath id="k-clip-sec"><circle cx="267" cy="256" r="16.5"/></clipPath>
